<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 6 — Free before a single dollar (paper-trade toggle press) -->
    <!-- NOTE: everything the runtime needs lives INSIDE <template> below. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }

        /* Root styled via #root only (scoper drops class-on-root rules). */
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: "Inter", sans-serif;
        }

        /* Full-bleed dark ground — dedicated clip layer, never on #root. */
        .f06-bg {
          position: absolute;
          inset: 0;
          background: #08080c;
        }

        .f06-stage {
          position: absolute;
          inset: 0;
        }

        /* ——— settings-row card (hero cutout) ——— */
        #f06-card {
          position: absolute;
          left: 11cqw;
          top: 560px;
          width: 78cqw;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 40px;
          padding: 52px 56px;
          background: rgba(77, 93, 255, 0.1);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 14px;
        }
        .f06-card-copy {
          min-width: 0;
        }
        #f06-label {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 58px;
          line-height: 1.15;
          letter-spacing: -0.02em;
          color: #f4f5fa;
        }
        #f06-subnote {
          margin-top: 14px;
          font-family: "Inter", sans-serif;
          font-weight: 400;
          font-size: 29px;
          line-height: 1.4;
          color: #a6acc4;
        }

        /* ——— pill toggle ——— */
        #f06-toggle {
          position: relative;
          flex: 0 0 auto;
          width: 170px;
          height: 92px;
          will-change: transform;
        }
        #f06-track {
          position: absolute;
          inset: 0;
          background: rgba(244, 245, 250, 0.15);
          border: 1.5px solid rgba(77, 93, 255, 0.4);
          border-radius: 100px;
        }
        #f06-knob {
          position: absolute;
          left: 9px;
          top: 9px;
          width: 74px;
          height: 74px;
          border-radius: 50%;
          background: #ffffff;
          border: 1.5px solid rgba(77, 93, 255, 0.45);
          will-change: transform;
        }

        /* Finger-sized soft tap-highlight (thumb, not an arrow cursor). */
        #f06-tap {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 150px;
          height: 150px;
          margin-left: -75px;
          margin-top: -75px;
          border-radius: 50%;
          background: radial-gradient(
            circle,
            rgba(77, 93, 255, 0.58) 0%,
            rgba(77, 93, 255, 0.25) 55%,
            rgba(77, 93, 255, 0) 72%
          );
          opacity: 0;
          pointer-events: none;
          z-index: 4;
          will-change: transform, opacity;
        }

        /* Click ripple rings — expand from the toggle center. */
        .f06-ripple {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 150px;
          height: 150px;
          margin-left: -75px;
          margin-top: -75px;
          border-radius: 50%;
          border: 2.5px solid rgba(77, 93, 255, 0.9);
          opacity: 0;
          pointer-events: none;
          z-index: 3;
          will-change: transform, opacity;
        }

        /* ——— "$0 to try" tag-pill (the frame's one sanctioned pop) ——— */
        #f06-pill {
          position: absolute;
          right: 7cqw;
          top: 506px;
          padding: 15px 36px;
          background: #4d5dff;
          border: 1.5px solid rgba(255, 255, 255, 0.25);
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 36px;
          letter-spacing: 0.01em;
          color: #ffffff;
          white-space: nowrap;
          transform-origin: 22% 88%;
          z-index: 5;
          will-change: transform, opacity;
        }

        /* ——— tag line beneath the card (discrete stepped reveal) ——— */
        #f06-tagline {
          position: absolute;
          left: 0;
          top: 924px;
          width: 100%;
          text-align: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 33px;
          letter-spacing: 0;
          color: #a6acc4;
          white-space: nowrap;
        }
        .f06-tw {
          display: inline-block;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="06-paper-trade"
        data-duration="5.52"
        data-width="1080"
        data-height="1920"
      >
        <!-- ground: full-duration clip on the lowest track -->
        <div class="clip f06-bg" data-start="0" data-duration="5.12" data-track-index="0"></div>

        <!-- content stage: full-duration clip -->
        <div class="clip f06-stage" data-start="0" data-duration="5.12" data-track-index="1">
          <!-- Scene 1 — settings-row card, toggle OFF -->
          <div id="f06-card">
            <div class="f06-card-copy">
              <div id="f06-label">Paper Trading</div>
              <div id="f06-subnote">real market prices</div>
            </div>
            <div id="f06-toggle">
              <div id="f06-track"></div>
              <div id="f06-knob"></div>
              <div class="f06-ripple" id="f06-ripple-1"></div>
              <div class="f06-ripple" id="f06-ripple-2"></div>
              <div id="f06-tap"></div>
            </div>
          </div>

          <!-- Scene 2 payoff — "$0 to try" tag-pill -->
          <div id="f06-pill">$0 to try</div>

          <!-- Scene 3 — muted tag line, revealed in discrete steps -->
          <div id="f06-tagline">
            <span class="f06-tw" id="f06-tw1">paper trade</span><span
              class="f06-tw"
              id="f06-tw2"
            >&nbsp;=&nbsp;free,</span><span class="f06-tw" id="f06-tw3">&nbsp;real prices</span>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* VO (5.12s): "And I could paper-trade it | on real prices | — free — |
             before risking | a single dollar."
             Estimated cues: "paper-trade" ~0.65 · "real prices" ~1.55 · "free" ~2.25 ·
             "before risking" ~3.0 · "single" ~3.75 · "dollar" ~4.2 */

          // ————— Scene 1 (0.0–1.64s): row reveals as the VO reaches it —————
          // dynamic-content-sequencing: card shell first, label on "paper-trade",
          // sub-note on "real prices". Smooth long-tail settles, no overshoot.
          tl.fromTo(
            "#f06-card",
            { opacity: 0, y: 44 },
            { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
            0.12
          );
          tl.fromTo(
            "#f06-label",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            0.6
          );
          tl.fromTo(
            "#f06-subnote",
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            1.5
          );

          // ————— Scene 2 (1.64–3.07s): the click IS the climax —————
          // cursor-click-ripple (thumb variant): tap-highlight lands on the toggle…
          tl.fromTo(
            "#f06-tap",
            { opacity: 0, scale: 0.55 },
            { opacity: 0.6, scale: 1, duration: 0.28, ease: "power2.out" },
            1.95
          );

          // press-release-spring — press: linear-ish compression on "free"
          var PRESS_AT = 2.28;
          var RELEASE_AT = 2.4; // = PRESS_AT + press duration (state continuity)
          tl.to(
            "#f06-toggle",
            { scale: 0.93, duration: 0.12, ease: "power1.in" },
            PRESS_AT
          );
          // release: smooth long-tail recovery (house style — no back.out)
          tl.to(
            "#f06-toggle",
            { scale: 1, duration: 0.45, ease: "power3.out" },
            RELEASE_AT
          );
          // the UI answers live: knob slides, track fills cobalt
          tl.to(
            "#f06-knob",
            { x: 78, duration: 0.38, ease: "power3.out" },
            RELEASE_AT
          );
          tl.to(
            "#f06-track",
            {
              backgroundColor: "#4D5DFF",
              borderColor: "#4D5DFF",
              duration: 0.32,
              ease: "power2.inOut",
            },
            RELEASE_AT
          );
          // ripple rings radiate from the click point (immediateRender:false
          // holds the CSS-hidden state until the click moment)
          tl.fromTo(
            ["#f06-ripple-1", "#f06-ripple-2"],
            { scale: 0, opacity: 0.6 },
            {
              scale: 2.8,
              opacity: 0,
              duration: 0.65,
              ease: "power2.out",
              stagger: 0.09,
              immediateRender: false,
            },
            RELEASE_AT
          );
          // tap-highlight dissipates after the press
          tl.to(
            "#f06-tap",
            { opacity: 0, duration: 0.3, ease: "power2.out" },
            2.58
          );

          // spring-pop-entrance — the frame's ONE pop: "$0 to try" tag-pill,
          // origin-anchored at the card corner, smooth power3 settle.
          tl.fromTo(
            "#f06-pill",
            { scale: 0, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
            2.52
          );

          // ————— Scene 3 (3.07–5.12s): tag line steps in, then stillness —————
          // discrete-text-sequence: the line arrives in three discrete states,
          // each fading up on its spoken cue ("before risking" / "single" / "dollar").
          tl.fromTo(
            "#f06-tw1",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
            3.15
          );
          tl.fromTo(
            "#f06-tw2",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
            3.7
          );
          tl.fromTo(
            "#f06-tw3",
            { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
            4.2
          );
          // settles by ~4.58s — dead-still hold to 5.12s (no exit: non-final frame).

          window.__timelines["06-paper-trade"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
