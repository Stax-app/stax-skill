<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Frame 4 — It built the whole thing</title>
  </head>
  <body>
    <template>
      <style>
        /* ---- fonts (variable files shipped with the project) ---- */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }

        /* ---- root (styled via #root, never a class) ---- */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "Space Grotesk", sans-serif;
        }

        /* ---- full-bleed dark product ground: its own clip, never on #root ---- */
        .f4-bg {
          position: absolute;
          inset: 0;
          background: #0B0E11;
        }

        /* ---- stage + camera wrapper (multi-phase-camera: steady push) ---- */
        .f4-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #f4-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        /* ---- slide-header (upper third, left-anchored) ---- */
        .f4-header {
          position: absolute;
          left: 54px;
          right: 54px;
          top: 210px;
        }
        .f4-eyebrow-row {
          display: flex;
          align-items: center;
          gap: 20px;
        }
        #f4-line {
          width: 60px;
          height: 4px;
          border-radius: 2px;
          background: #2BD97C;
          transform-origin: 0% 50%;
          will-change: transform;
        }
        #f4-eyebrow {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 27px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #2BD97C;
          will-change: transform;
        }
        .f4-h2-row {
          display: flex;
          align-items: center;
          gap: 30px;
          margin-top: 26px;
        }
        #f4-h2 {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 96px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          color: #F2F5F4;
          white-space: nowrap;
          will-change: transform;
        }
        /* payoff pill — solid green, near-black text: the one sanctioned spring-pop */
        #f4-pill {
          display: inline-block;
          background: #2BD97C;
          color: #0B0E11;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 26px;
          letter-spacing: 0.06em;
          padding: 16px 34px;
          border-radius: 100px;
          white-space: nowrap;
          transform-origin: 0% 50%;
          will-change: transform;
        }

        /* ---- ticker-pill grid: the strategy = a basket of real tickers
                (center-outward-expansion, short-path into-slot form) ---- */
        .f4-basket {
          position: absolute;
          top: 900px; /* grid center — rows span ~640..1160, well above the 1600 keep-out */
          left: 50%;
          width: 0;
          height: 0;
        }
        .f4-ticker {
          position: absolute;
          top: 0;
          left: 0;
          /* no CSS transform here — self-centering is baked into the GSAP fromTo
             via xPercent/yPercent (gsap_css_transform_conflict) */
          width: 440px;
          height: 140px;
          box-sizing: border-box;
          background: #15191D;
          border: 1.5px solid #2A2F34;
          border-radius: 100px; /* rounded-full chip, as in the product UI */
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 24px;
          will-change: transform;
        }
        .f4-logo {
          flex: 0 0 auto;
          /* product logo square is 20px r5 — rendered at ~2.2x for video legibility,
             ratio preserved (44:11 = 20:5) */
          width: 44px;
          height: 44px;
          border-radius: 11px;
        }
        .f4-ticker-txt {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 48px;
          letter-spacing: 0.01em;
          color: #F2F5F4;
        }

        /* ---- counter line under the basket ---- */
        #f4-counter {
          position: absolute;
          left: 54px;
          right: 54px;
          top: 1236px;
          text-align: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 36px;
          letter-spacing: 0.05em;
          color: #A8B3AE;
          will-change: transform;
        }
        #f4-count-num {
          display: inline-block;
          min-width: 1.95em;
          text-align: right;
          font-variant-numeric: tabular-nums;
          font-weight: 600;
          color: #F2F5F4;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-built-the-thing"
        data-width="1080"
        data-height="1920"
        data-duration="7.412"
      >
        <!-- full-bleed product-dark ground (lowest track; spans the exit overlap too) -->
        <div class="clip f4-bg" data-start="0" data-duration="7.412" data-track-index="0"></div>

        <!-- all scene content rides inside the camera -->
        <div class="clip f4-stage" data-start="0" data-duration="7.412" data-track-index="1">
          <div id="f4-cam">
            <!-- Scene 1 — slide-header fills line-by-line -->
            <div class="f4-header">
              <div class="f4-eyebrow-row">
                <div id="f4-line"></div>
                <div id="f4-eyebrow">Built from 3 answers</div>
              </div>
              <div class="f4-h2-row">
                <div id="f4-h2">Your strategy</div>
                <!-- Scene 3 — the one sanctioned spring-pop -->
                <div id="f4-pill">RULES-BASED</div>
              </div>
            </div>

            <!-- Scene 2 — six real ticker pills stagger-assemble, 2 per row × 3 rows -->
            <div class="f4-basket">
              <div class="f4-ticker" data-tx="-240" data-ty="-190">
                <div class="f4-logo" style="background: #E8492B"></div>
                <div class="f4-ticker-txt">PANW</div>
              </div>
              <div class="f4-ticker" data-tx="240" data-ty="-190">
                <div class="f4-logo" style="background: #2B6FE8"></div>
                <div class="f4-ticker-txt">ZTO</div>
              </div>
              <div class="f4-ticker" data-tx="-240" data-ty="0">
                <div class="f4-logo" style="background: #8B2BE8"></div>
                <div class="f4-ticker-txt">ACN</div>
              </div>
              <div class="f4-ticker" data-tx="240" data-ty="0">
                <div class="f4-logo" style="background: #6B7280"></div>
                <div class="f4-ticker-txt">CRNX</div>
              </div>
              <div class="f4-ticker" data-tx="-240" data-ty="190">
                <div class="f4-logo" style="background: #C8A82B"></div>
                <div class="f4-ticker-txt">DTM</div>
              </div>
              <div class="f4-ticker" data-tx="240" data-ty="190">
                <div class="f4-logo" style="background: #D0342C"></div>
                <div class="f4-ticker-txt">EQT</div>
              </div>
            </div>

            <!-- versions-tested counter, synced to the assemble window -->
            <div id="f4-counter">
              <span id="f4-count-num">0</span>&nbsp;versions tested so far
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* Timing (6.912s voice window; root holds an extra 0.5s for the exit push):
           Scene 1: 0.0–1.8   "here's the part that got me — I answered like three"
           Scene 2: 1.8–4.4   "it built the whole thing" — ticker pills assemble + count-up
           Scene 3: 4.4–6.9   "a real, rules-based strategy" — pill pop + slow push-in, hold */

        /* ---- Scene 1 — slide-header fills line-by-line (dynamic-content-sequencing) ---- */
        tl.fromTo(
          "#f4-line",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.6, ease: "power3.out" },
          0.1,
        );
        tl.fromTo(
          "#f4-eyebrow",
          { opacity: 0, y: 22 },
          { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" },
          0.16,
        );
        tl.fromTo(
          "#f4-h2",
          { opacity: 0, y: 36 },
          { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
          0.55,
        );

        /* ---- Scene 2 — ticker pills stagger-assemble one by one
                (center-outward-expansion, partially-spread short-path form:
                 START_PROGRESS 0.5, smooth power3 long-tail settle) ---- */
        const PILLS_AT = 1.9;
        const PILL_GAP = 0.36; /* one-by-one cascade across the assemble window */
        const PILL_DUR = 0.75;
        gsap.utils.toArray(".f4-ticker").forEach((el, i) => {
          const tx = Number(el.dataset.tx);
          const ty = Number(el.dataset.ty);
          tl.fromTo(
            el,
            /* xPercent/yPercent bake the self-centering; x/y travel the short
               path from half-spread (0.5 × target) into the slot */
            {
              xPercent: -50,
              yPercent: -50,
              x: tx * 0.5,
              y: ty * 0.5,
              scale: 0.9,
              opacity: 0,
            },
            {
              x: tx,
              y: ty,
              scale: 1,
              opacity: 1,
              duration: PILL_DUR,
              ease: "power3.out",
            },
            PILLS_AT + i * PILL_GAP,
          );
        });

        /* ---- counter line — deterministic object-value count-up 0→747
                (counting-dynamic-scale, value-only form) synced to the
                pills' assemble window ---- */
        tl.fromTo(
          "#f4-counter",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          1.95,
        );
        const f4CountEl = document.getElementById("f4-count-num");
        const f4Count = { value: 0 };
        tl.fromTo(
          f4Count,
          { value: 0 },
          {
            value: 747,
            duration: 2.4,
            ease: "power2.out",
            onUpdate: () => {
              f4CountEl.textContent = String(Math.round(f4Count.value));
            },
          },
          2.0,
        );

        /* ---- Scene 3 — "a real, rules-based strategy" ---- */
        /* RULES-BASED solid-green pill: the frame's ONE sanctioned spring-pop
           (spring-pop-entrance, playful overshoot kept modest, origin-anchored
           beside the header so it emerges from the h2) */
        tl.fromTo(
          "#f4-pill",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.65, ease: "back.out(1.6)" },
          4.55,
        );

        /* Slow camera push-in (multi-phase-camera, steady-push phase):
           neutral → gentle push, settles before the end; no drift — the
           project motion grammar keeps holds still */
        tl.fromTo(
          "#f4-cam",
          { scale: 1 },
          { scale: 1.045, duration: 1.9, ease: "power2.inOut" },
          4.75,
        );

        window.__timelines["04-built-the-thing"] = tl;
      </script>
    </template>
  </body>
</html>
