      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ── Scene 1 (0.0–0.55s): label + instruments stage in —
           header row rises, three metric cards stagger in, chart card
           rises beneath, chrome (pills / grid / axes) washes in. ──────── */
        tl.fromTo(
          "#f05-header-title",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.02
        );
        tl.fromTo(
          "#f05-header-meta",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.1
        );

        const f05Cards = ["#f05-mc1", "#f05-mc2", "#f05-mc3"];
        f05Cards.forEach((sel, i) => {
          tl.fromTo(
            sel,
            { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
            0.16 + i * 0.1
          );
        });

        tl.fromTo(
          "#f05-card",
          { opacity: 0, y: 42, scale: 0.98 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },
          0.26
        );
        tl.fromTo(
          "#f05-pill-strategy",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.42
        );
        tl.fromTo(
          "#f05-pill-trades",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.48
        );
        tl.fromTo(
          "#f05-pill-spy",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          0.54
        );

        const f05Grid = gsap.utils.toArray(".f05-gridln");
        f05Grid.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            0.44 + i * 0.04
          );
        });
        const f05Axes = gsap.utils.toArray(".f05-ax");
        f05Axes.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            0.5 + i * 0.03
          );
        });

        // metric values 2 & 3 settle in with their cards (value 1 counts up)
        tl.fromTo(
          "#f05-val2",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.55
        );
        tl.fromTo(
          "#f05-val3",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.62
        );

        /* ── Scene 2 (0.55–2.1s): the evidence arrives — the strategy
           curve DRAWS left→right (svg-path-draw: dasharray = measured
           length, linear rate), the Return figure COUNTS UP 0 → 104.7 on
           the SAME window, the dashed SPY line reveals just behind it,
           and Buy/Sell triangles spring-pop as the draw passes them. ──── */
        const F05_DRAW_START = 0.55;
        const F05_DRAW_DUR = 1.45;

        // deterministic object-value count-up, 1 decimal, format "104.7%"
        const f05Val1El = document.getElementById("f05-val1");
        const f05Ret = { v: 0 };
        tl.fromTo(
          f05Ret,
          { v: 0 },
          {
            v: 104.7,
            duration: F05_DRAW_DUR,
            ease: "none",
            onUpdate: () => {
              f05Val1El.textContent = f05Ret.v.toFixed(1) + "%";
            },
          },
          F05_DRAW_START
        );

        // strategy curve draw (getTotalLength dasharray)
        const f05Line = document.getElementById("f05-line");
        const f05Len = f05Line.getTotalLength() * 1.02;
        f05Line.style.strokeDasharray = String(f05Len);
        f05Line.style.strokeDashoffset = String(f05Len);
        tl.fromTo(
          f05Line,
          { strokeDashoffset: f05Len },
          { strokeDashoffset: 0, duration: F05_DRAW_DUR, ease: "none" },
          F05_DRAW_START
        );

        // area fill develops beneath the curve as the draw crosses mid-chart
        tl.fromTo(
          "#f05-area",
          { opacity: 0 },
          { opacity: 1, duration: 0.9, ease: "power1.inOut" },
          1.1
        );

        // dashed SPY line — dash pattern stays intact; an expanding clip
        // rect reveals it left→right slightly behind the strategy draw
        tl.fromTo(
          "#f05-spyrect",
          { attr: { width: 0 } },
          { attr: { width: 862 }, duration: F05_DRAW_DUR, ease: "none" },
          0.72
        );

        // Buy/Sell markers pop just after the draw passes each x position:
        // t = DRAW_START + DRAW_DUR * ((x - 70) / 840) + 0.12 (precomputed)
        const f05Marks = [
          ["#f05-b1", 155, 434, 0.82],
          ["#f05-b2", 240, 402, 0.96],
          ["#f05-s1", 325, 352, 1.11],
          ["#f05-b3", 425, 350, 1.28],
          ["#f05-s2", 445, 306, 1.32],
          ["#f05-b4", 510, 398, 1.43],
          ["#f05-s3", 560, 290, 1.52],
          ["#f05-b5", 600, 320, 1.59],
          ["#f05-s4", 685, 256, 1.73],
          ["#f05-b6", 780, 208, 1.9],
          ["#f05-s5", 820, 124, 1.97],
          ["#f05-b7", 885, 110, 2.08],
        ];
        f05Marks.forEach(([sel, cx, cy, at]) => {
          tl.fromTo(
            sel,
            { scale: 0, opacity: 0 },
            {
              scale: 1,
              opacity: 1,
              duration: 0.38,
              ease: "power3.out",
              svgOrigin: cx + " " + cy,
            },
            at
          );
        });

        // small green end dot lands as the draw finishes
        tl.fromTo(
          "#f05-enddot",
          { scale: 0, opacity: 0 },
          {
            scale: 1,
            opacity: 1,
            duration: 0.4,
            ease: "power3.out",
            svgOrigin: "910 38",
          },
          2.0
        );

        /* ── Scene 3 (2.05–3.5s): resolve — the change chips pop once the
           figures land, legend + disclaimer fade up, and a soft green glow
           blooms behind the chart card. Held read to the end — no exit. ── */
        const f05Chips = ["#f05-chip1", "#f05-chip2", "#f05-chip3"];
        f05Chips.forEach((sel, i) => {
          tl.fromTo(
            sel,
            { scale: 0.6, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
            2.05 + i * 0.12
          );
        });

        tl.fromTo(
          "#f05-legend",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          2.25
        );

        tl.fromTo(
          "#f05-disclaimer",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          2.5
        );

        // ambient-glow-bloom: bloom-and-hold (no breathe — held read)
        tl.fromTo(
          "#f05-glow",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.3, scale: 1, duration: 0.85, ease: "power2.out" },
          2.65
        );

        window.__timelines["05-backtest-result"] = tl;
      </script>
    </template>
