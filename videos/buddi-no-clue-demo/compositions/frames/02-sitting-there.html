<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Frame 2 — Just… sitting there</title>
    <!-- head is source-file metadata only; the runtime clones ONLY the <template> contents -->
  </head>
  <body>
    <template>
      <style>
        /* Fonts ship with the project — variable files, declare the weight range */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
        }

        /* Root styled via #root (never a class — scoper drops class-on-root rules) */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: "Space Grotesk", sans-serif;
        }

        /* Full-bleed cream ground lives on its own clip layer, never on #root */
        #f2-bg {
          position: absolute;
          inset: 0;
          background: #08080C;
        }

        #f2-stage {
          position: absolute;
          inset: 0;
        }

        /* ---------- The boring bank card (still-life prop, upper third, NEVER moves) ---------- */
        #f2-card {
          position: absolute;
          top: 300px;
          left: 170px;
          width: 740px;
          box-sizing: border-box;
          padding: 48px;
          background: rgba(77, 93, 255, 0.1);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 14px;
        }
        .card-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .card-eyebrow {
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 27px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #4D5DFF;
        }
        .card-dots {
          display: flex;
          gap: 8px;
        }
        .card-dots span {
          display: block;
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #767C94;
        }
        .card-balance {
          margin-top: 30px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 700;
          font-size: 88px;
          line-height: 1;
          color: #4D5DFF;
        }
        .card-sub {
          margin-top: 22px;
          font-family: "Inter", sans-serif;
          font-weight: 400;
          font-size: 30px;
          line-height: 1.6;
          color: #A6ACC4;
        }
        /* zero-activity bar: an empty near-white-18% track, no fill — the flatline */
        .card-track {
          margin-top: 30px;
          height: 8px;
          border-radius: 6px;
          background: rgba(244, 245, 250, 0.18);
        }

        /* ---------- Tag pill under the card (Scene 3) ---------- */
        #f2-tagwrap {
          position: absolute;
          top: 706px;
          left: 0;
          right: 0;
          display: flex;
          justify-content: center;
        }
        #f2-tagpill {
          display: flex;
          align-items: center;
          gap: 16px;
          padding: 16px 34px;
          background: rgba(77, 93, 255, 0.16);
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 500;
          font-size: 30px;
          color: #4D5DFF;
          opacity: 0;
        }
        #f2-tagpill svg {
          display: block;
        }

        /* ---------- Kinetic pain type (the hero) ---------- */
        #f2-pain {
          position: absolute;
          top: 880px;
          left: 80px;
          right: 80px;
          height: 520px;
        }
        .pain-line {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-weight: 600;
          font-size: 100px;
          line-height: 1.14;
          letter-spacing: -0.02em;
          color: #F4F5FA;
          text-align: center;
        }
        #f2-line1 .words {
          max-width: 920px;
        }
        #f2-line1 .w {
          display: inline-block; /* transformed elements must be block-level */
          margin: 0 0.12em;
        }
        #f2-line2,
        #f2-line3 {
          opacity: 0;
        }
        .row {
          display: block;
        }
        .grow-wrap {
          position: relative;
          display: inline-block;
        }
        /* drawn cobalt underline — sweeps in under "grow", later drains away */
        #f2-underline {
          position: absolute;
          left: -6px;
          right: -6px;
          bottom: -14px;
          height: 10px;
          background: #4D5DFF;
          border-radius: 5px;
          transform-origin: left center;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-sitting-there"
        data-width="1080"
        data-height="1920"
        data-duration="7.376"
      >
        <!-- full-bleed cream ground -->
        <div id="f2-bg" class="clip" data-start="0" data-duration="6.976" data-track-index="0"></div>

        <!-- content layer -->
        <div id="f2-stage" class="clip" data-start="0" data-duration="6.976" data-track-index="1">
          <!-- Scene prop: dead-still bank card. No tween anywhere — the stillness IS the pain. -->
          <div id="f2-card">
            <div class="card-top">
              <div class="card-eyebrow">Savings</div>
              <div class="card-dots"><span></span><span></span><span></span></div>
            </div>
            <div class="card-balance">$1,000.00</div>
            <div class="card-sub">No activity this year</div>
            <div class="card-track"></div>
          </div>

          <!-- Scene 3 tag: "just… sitting there" + zzz (SVG glyph, no emoji fonts on render box) -->
          <div id="f2-tagwrap">
            <div id="f2-tagpill">
              <span>just… sitting there</span>
              <svg width="52" height="40" viewBox="0 0 52 40" fill="none" aria-hidden="true">
                <path d="M2 26 h10 L2 36 h10" stroke="#1e2bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55" />
                <path d="M16 15 h13 L16 28 h13" stroke="#1e2bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" />
                <path d="M33 2 h16 L33 18 h16" stroke="#1e2bfa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
          </div>

          <!-- Kinetic type zone: three stacked line states, hard-cut in place -->
          <div id="f2-pain">
            <div class="pain-line" id="f2-line1">
              <span class="words">
                <span class="w">That&rsquo;s</span><span class="w">most</span><span class="w">of</span><span class="w">us,</span><span class="w">right?</span>
              </span>
            </div>

            <div class="pain-line" id="f2-line2">
              <span class="row"><span class="l2t">you want it</span></span>
              <span class="row">
                <span class="l2t">to&nbsp;</span><span class="grow-wrap"><span class="l2t">grow</span><span id="f2-underline"></span></span>
              </span>
            </div>

            <div class="pain-line" id="f2-line3">
              <span class="row">&ldquo;where do I</span>
              <span class="row">even start&rdquo;</span>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          var tl = gsap.timeline({ paused: true });

          /* VO (6.976s): "That's most of us, right? | You want your money to grow —
             | but 'where do I even start' freezes you. | So it just sits there."
             Scene windows rescaled from the 6s estimate (×1.163):
             S1 0–1.9 · S2 1.9–4.2 · S3 4.2–6.976 */

          /* ---- Scene 1: card is simply THERE (static, no tween — never moves once).
                 "That's most of us, right?" reveals per word on the spoken line. ---- */
          tl.fromTo(
            "#f2-line1 .w",
            { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.34, ease: "power3.out", stagger: 0.22 },
            0.3
          );

          /* ---- Scene 2: hard cut (kinetic-type token swap, no roll/fade) to
                 "you want it / to grow" as the VO reaches "you want your money to grow" ---- */
          tl.set("#f2-line1", { opacity: 0 }, 1.95);
          tl.set("#f2-line2", { opacity: 1 }, 1.95);

          /* cobalt drawn underline sweeps under "grow" on the word ---- */
          tl.fromTo(
            "#f2-underline",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.45, ease: "power2.out" },
            2.6
          );

          /* hard cut again to the frozen quote — text swaps, underline PERSISTS ---- */
          tl.set("#f2-line2 .l2t", { opacity: 0 }, 3.3);
          tl.set("#f2-line3", { opacity: 1 }, 3.3);

          /* ...and the underline drains away: the gesture freezes ("freezes you") ---- */
          tl.to("#f2-underline", { scaleX: 0, duration: 0.6, ease: "power2.inOut" }, 3.85);
          tl.set("#f2-line2", { opacity: 0 }, 4.55);

          /* ---- Scene 3: "so it just sits there" — pain line clears, muted tag fades
                 up small under the card, then EVERYTHING holds dead still to the end. ---- */
          tl.set("#f2-line3", { opacity: 0 }, 4.85);
          tl.fromTo(
            "#f2-tagpill",
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" },
            5.05
          );
          /* 5.65 → 6.976: deliberate dead-still hold — no jitter, no drift. */

          window.__timelines["02-sitting-there"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
