<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 3 — It just asks you questions (buddi-no-clue-demo)
         Sub-composition: everything the runtime needs lives INSIDE <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ---------- Fonts (variable, shipped with the project) ---------- */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }

        /* ---------- Root (styled via #root, never a class) ---------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* Full-bleed cream ground — its own clip layer, never on #root */
        .f3-bg {
          position: absolute;
          inset: 0;
          background: #08080C;
        }

        /* Camera stage */
        .f3-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .f3-world {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 2600px;
          transform-origin: 0 0;
          will-change: transform;
        }

        /* ---------- Chat surface (bezel-less, floats on cream) ---------- */
        .f3-sent {
          position: absolute;
          right: 119px;
          top: 170px;
          max-width: 640px;
          background: #4D5DFF;
          color: #FFFFFF;
          border-radius: 24px 24px 8px 24px;
          padding: 28px 36px;
          font-size: 34px;
          font-weight: 450;
          line-height: 1.45;
        }
        .f3-namepill {
          position: absolute;
          left: 119px;
          top: 428px;
          display: inline-block;
          background: rgba(77, 93, 255, 0.16);
          color: #4D5DFF;
          border-radius: 100px;
          padding: 8px 26px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 25px;
          font-weight: 500;
          letter-spacing: 0.02em;
        }
        .f3-reply {
          position: absolute;
          left: 119px;
          top: 492px;
          width: 680px;
          min-height: 152px;
          background: rgba(77, 93, 255, 0.10);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 24px 24px 24px 8px;
          padding: 28px 36px;
          font-size: 34px;
          font-weight: 400;
          line-height: 1.45;
          color: #F4F5FA;
        }
        .f3-dots {
          position: absolute;
          left: 36px;
          top: 46px;
          display: flex;
          gap: 12px;
        }
        .f3-dot {
          width: 15px;
          height: 15px;
          border-radius: 50%;
          background: #767C94;
          opacity: 0.25;
        }

        /* ---------- Question cards ---------- */
        .f3-qcard {
          position: absolute;
          left: 119px;
          width: 842px;
          height: 476px;
          background: rgba(77, 93, 255, 0.10);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 14px;
          padding: 44px 48px;
          box-sizing: border-box;
        }
        #f3-q1 { top: 760px; }
        #f3-q2 { top: 1320px; }
        #f3-q3 { top: 1880px; }
        .f3-qhead {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 54px;
        }
        .f3-qlabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 42px;
          font-weight: 600;
          letter-spacing: -0.02em;
          color: #F4F5FA;
          line-height: 1.2;
        }
        .f3-qcount {
          background: rgba(77, 93, 255, 0.16);
          color: #4D5DFF;
          border-radius: 100px;
          padding: 6px 20px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 23px;
          font-weight: 500;
        }
        .f3-chips {
          margin-top: 30px;
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        .f3-chip {
          height: 88px;
          display: flex;
          align-items: center;
          padding: 0 36px;
          box-sizing: border-box;
          background: rgba(77, 93, 255, 0.10);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 32px;
          font-weight: 500;
          color: #F4F5FA;
          will-change: transform;
        }

        /* ---------- Tap actor (finger-sized highlight, no arrow cursor) ---------- */
        .f3-tap {
          position: absolute;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: rgba(77, 93, 255, 0.27);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          opacity: 0;
          pointer-events: none;
          z-index: 5;
          will-change: transform;
        }
        .f3-ripple {
          position: absolute;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          border: 2.5px solid rgba(77, 93, 255, 0.81);
          opacity: 0;
          pointer-events: none;
          z-index: 4;
          will-change: transform;
        }
        /* tap/ripple anchors — centered on each selected chip
           chip i center-y inside card = 128 + i*108 + 44 ; center-x = 421 */
        #f3-tap1 { left: 373px; top: 224px; }   /* Q1 chip 0 → 172-48 */
        .f3-r1   { left: 366px; top: 217px; }
        #f3-tap2 { left: 373px; top: 440px; }   /* Q2 chip 2 → 388-48 */
        .f3-r2   { left: 366px; top: 433px; }
        #f3-tap3 { left: 373px; top: 332px; }   /* Q3 chip 1 → 280-48 */
        .f3-r3   { left: 366px; top: 325px; }

        /* ---------- Summary stack (Scene 3) ---------- */
        .f3-sumhead {
          position: absolute;
          left: 119px;
          top: 1496px;
          width: 842px;
          text-align: center;
          font-family: "Space Grotesk", sans-serif;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #4D5DFF;
        }
        .f3-sumpill {
          position: absolute;
          left: 219px;
          width: 642px;
          height: 120px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 40px;
          box-sizing: border-box;
          background: rgba(77, 93, 255, 0.16);
          border: 1.5px solid rgba(77, 93, 255, 0.38);
          border-radius: 100px;
          will-change: transform;
        }
        #f3-sum1 { top: 1580px; }
        #f3-sum2 { top: 1724px; }
        #f3-sum3 { top: 1868px; }
        .f3-check {
          width: 52px;
          height: 52px;
          flex: none;
        }
        .f3-check path {
          fill: none;
          stroke: #4D5DFF;
          stroke-width: 4;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f3-sumlabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 34px;
          font-weight: 500;
          color: #4D5DFF;
        }
      </style>

      <div id="root" data-composition-id="03-asks-questions" data-width="1080" data-height="1920">
        <!-- full-bleed ground as a clip layer -->
        <div class="clip f3-bg" data-start="0" data-duration="9.344" data-track-index="0"></div>

        <div class="clip f3-stage" data-start="0" data-duration="9.344" data-track-index="1">
          <div class="f3-world" id="f3-world">
            <!-- Scene 1: the sent bubble from Frame 1 + Buddi's reply -->
            <div class="f3-sent" id="f3-sent">I have $1,000 and no clue what to do with it</div>
            <div class="f3-namepill" id="f3-namepill">buddi</div>
            <div class="f3-reply" id="f3-reply">
              <div class="f3-dots" id="f3-dots">
                <span class="f3-dot"></span><span class="f3-dot"></span><span class="f3-dot"></span>
              </div>
              <span id="f3-replytext"></span>
            </div>

            <!-- Scene 2: three question cards, one tap each -->
            <div class="f3-qcard" id="f3-q1">
              <div class="f3-qhead">
                <div class="f3-qlabel">What&rsquo;s the goal?</div>
                <div class="f3-qcount">1 of 3</div>
              </div>
              <div class="f3-chips">
                <div class="f3-chip" id="f3-q1c1">Grow it steadily</div>
                <div class="f3-chip">Chase big wins</div>
                <div class="f3-chip">Keep it safe</div>
              </div>
              <div class="f3-ripple f3-r1" id="f3-r1a"></div>
              <div class="f3-ripple f3-r1" id="f3-r1b"></div>
              <div class="f3-tap" id="f3-tap1"></div>
            </div>

            <div class="f3-qcard" id="f3-q2">
              <div class="f3-qhead">
                <div class="f3-qlabel">How long can it sit?</div>
                <div class="f3-qcount">2 of 3</div>
              </div>
              <div class="f3-chips">
                <div class="f3-chip">Under a year</div>
                <div class="f3-chip">A few years</div>
                <div class="f3-chip" id="f3-q2c3">3+ years</div>
              </div>
              <div class="f3-ripple f3-r2" id="f3-r2a"></div>
              <div class="f3-ripple f3-r2" id="f3-r2b"></div>
              <div class="f3-tap" id="f3-tap2"></div>
            </div>

            <div class="f3-qcard" id="f3-q3">
              <div class="f3-qhead">
                <div class="f3-qlabel">How much risk feels okay?</div>
                <div class="f3-qcount">3 of 3</div>
              </div>
              <div class="f3-chips">
                <div class="f3-chip">Low</div>
                <div class="f3-chip" id="f3-q3c2">Moderate</div>
                <div class="f3-chip">High</div>
              </div>
              <div class="f3-ripple f3-r3" id="f3-r3a"></div>
              <div class="f3-ripple f3-r3" id="f3-r3b"></div>
              <div class="f3-tap" id="f3-tap3"></div>
            </div>

            <!-- Scene 3: answered chips condense into a summary stack -->
            <div class="f3-sumhead" id="f3-sumhead">Three taps &middot; done</div>
            <div class="f3-sumpill" id="f3-sum1">
              <svg class="f3-check" viewBox="0 0 52 52"><path class="f3-checkpath" d="M13 27 L22 36 L39 17" /></svg>
              <span class="f3-sumlabel">Grow it steadily</span>
            </div>
            <div class="f3-sumpill" id="f3-sum2">
              <svg class="f3-check" viewBox="0 0 52 52"><path class="f3-checkpath" d="M13 27 L22 36 L39 17" /></svg>
              <span class="f3-sumlabel">3+ years</span>
            </div>
            <div class="f3-sumpill" id="f3-sum3">
              <svg class="f3-check" viewBox="0 0 52 52"><path class="f3-checkpath" d="M13 27 L22 36 L39 17" /></svg>
              <span class="f3-sumlabel">Moderate risk</span>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var root = document.querySelector('[data-composition-id="03-asks-questions"]');
          var $ = function (id) { return document.getElementById(id); };

          var world = $("f3-world");
          var sent = $("f3-sent");
          var namepill = $("f3-namepill");
          var reply = $("f3-reply");
          var replyText = $("f3-replytext");
          var dots = root.querySelectorAll(".f3-dot");
          var q1 = $("f3-q1"), q2 = $("f3-q2"), q3 = $("f3-q3");
          var chips = [$("f3-q1c1"), $("f3-q2c3"), $("f3-q3c2")];
          var taps = [$("f3-tap1"), $("f3-tap2"), $("f3-tap3")];
          var ripples = [
            [$("f3-r1a"), $("f3-r1b")],
            [$("f3-r2a"), $("f3-r2b")],
            [$("f3-r3a"), $("f3-r3b")],
          ];
          var sumhead = $("f3-sumhead");
          var sumpills = [$("f3-sum1"), $("f3-sum2"), $("f3-sum3")];
          var checkPaths = root.querySelectorAll(".f3-checkpath");

          // svg-path-draw setup — measure each check, park it undrawn
          checkPaths.forEach(function (p) {
            var len = p.getTotalLength();
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });

          // --- virtual camera (viewport-change, single-wrapper composite) ---
          // transform-origin is 0 0, so screen = S * world + cam offset.
          var cam = { s: 1, x: 0, y: 0 };
          function applyCamera() {
            world.style.transform =
              "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.s + ")";
          }
          applyCamera();

          var tl = gsap.timeline({ paused: true });

          /* ============ Scene 1 (0.0–3.0s) — chat arrives, Buddi replies ============ */

          // sent bubble (hero context, visible well before t=0.5)
          tl.fromTo(sent, { opacity: 0, y: 36 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.05);

          // quiet brand reveal — "buddi" name pill (small pop, smooth settle)
          tl.fromTo(namepill, { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0.95);

          // reply bubble lifts in
          tl.fromTo(reply, { opacity: 0, y: 28 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 1.05);

          // typing indicator — finite staggered pulses (no loops)
          dots.forEach(function (d, i) {
            tl.fromTo(d, { opacity: 0.25 },
              { opacity: 1, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 1 },
              1.1 + i * 0.1);
          });
          // pulses fully settle by 1.66; fade the row after that (no property overlap)
          tl.to(dots, { opacity: 0, duration: 0.16, ease: "power1.out" }, 1.68);

          // discrete-text-sequence (smooth-slice) — Buddi's reply types on
          var replyFull = "I can build this for you. Three quick questions first.";
          var len = { v: 0 };
          tl.to(len, {
            v: replyFull.length,
            duration: 1.4,
            ease: "none",
            onUpdate: function () {
              replyText.textContent = replyFull.substring(0, Math.floor(len.v));
            },
          }, 1.72);

          /* ============ Scene 2 (3.0–7.25s) — three questions, three taps ============ */

          // shared helpers
          function enterCard(card, at) {
            tl.fromTo(card, { opacity: 0, y: 90, scale: 0.98 },
              { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, at);
          }
          // cursor-click-ripple (thumb-tap variant) + press-release-spring
          function tap(i, at) {
            var dot = taps[i], chip = chips[i], rings = ripples[i];
            // tap-highlight lands (fade-grow instead of a mouse travel)
            tl.fromTo(dot, { opacity: 0, scale: 0.5 },
              { opacity: 1, scale: 1, duration: 0.28, ease: "power2.out" }, at);
            // press — linear compression (tap dot + chip compress together)
            tl.to(dot, { scale: 0.82, duration: 0.09, ease: "power1.in" }, at + 0.32);
            tl.to(chip, { scale: 0.955, duration: 0.09, ease: "power1.in" }, at + 0.32);
            // release — micro spring recovery (state-continuous with the press)
            tl.to(dot, { scale: 1, duration: 0.3, ease: "power2.out" }, at + 0.41);
            tl.to(chip, { scale: 1, duration: 0.42, ease: "back.out(1.3)" }, at + 0.41);
            // chip commits — fills cobalt at release
            tl.to(chip, {
              backgroundColor: "#4D5DFF",
              color: "#FFFFFF",
              borderColor: "#4D5DFF",
              duration: 0.22,
              ease: "power1.out",
            }, at + 0.41);
            // ripple rings radiate from the tap point (hold CSS-hidden until now)
            rings.forEach(function (r, k) {
              tl.fromTo(r, { scale: 0.35, opacity: 0.75 },
                { scale: 2.5, opacity: 0, duration: 0.55, ease: "power2.out",
                  immediateRender: false }, at + 0.38 + k * 0.08);
            });
            // tap-highlight lifts off
            tl.to(dot, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power1.in" }, at + 0.62);
          }

          // Q1 — "What's the goal?" → tap "Grow it steadily"
          enterCard(q1, 3.2);
          tap(0, 4.0);

          // camera servos down to Q2 (camera-cursor-tracking: chase the next interaction)
          tl.to(cam, { y: -748, duration: 0.8, ease: "power2.inOut", onUpdate: applyCamera }, 4.85);
          enterCard(q2, 5.0);
          tap(1, 5.7);

          // camera servos down to Q3
          tl.to(cam, { y: -1308, duration: 0.8, ease: "power2.inOut", onUpdate: applyCamera }, 6.45);
          enterCard(q3, 6.6);
          tap(2, 6.9);

          /* ============ Scene 3 (7.25–9.344s) — condense + settle wider, hold ============ */

          // answered cards condense away
          tl.to([q1, q2, q3], { opacity: 0, scale: 0.94, duration: 0.5, ease: "power2.in" }, 7.62);

          // camera settles wider on the summary
          tl.to(cam, { s: 0.9, x: 54, y: -782, duration: 0.95, ease: "power3.inOut",
            onUpdate: applyCamera }, 7.62);

          // eyebrow tag
          tl.fromTo(sumhead, { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 7.9);

          // spring-pop-entrance (smooth power3 settle) — summary pills stack in
          sumpills.forEach(function (p, i) {
            tl.fromTo(p, { opacity: 0, scale: 0.86, y: 22 },
              { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
              8.0 + i * 0.15);
          });

          // svg-path-draw — check marks trace on, staggered
          checkPaths.forEach(function (p, i) {
            tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
              8.32 + i * 0.16);
          });
          // then: dead-still hold to 9.344 — no exit (root transition owns it)

          window.__timelines["03-asks-questions"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
