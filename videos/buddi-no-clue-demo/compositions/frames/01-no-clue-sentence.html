  <body>
    <template>
      <style>

        #root {

        /* Full-bleed near-black ground — dedicated clip, never on #root */

        /* Camera group — gentle leftward drift + slight scale while typing */

        /* ---- TOP STEPPER — authentic app chrome ---- */
        .f1-stepper {
          position: absolute;
          left: 56px;
          right: 56px;
          top: 66px;
          height: 44px;
          display: flex;
          align-items: center;

          opacity: 0;
        }
        .f1-step {
          display: flex;

        .f1-step-label {

        .f1-step-line {

        /* ---- CHAT INPUT — the hero. Morphs into the sent user bubble. ---- */
        .f1-pill {
          position: absolute;
          left: 100px;
          top: 640px;
          width: 880px;
          height: 112px;
          background: #12171B;
          border: 1px solid #262D33;
          border-radius: 28px;
          overflow: hidden;
          opacity: 0;
        }
        .f1-input-inner {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          padding: 0 16px 0 44px;
        }
        .f1-viewport {
          flex: 1;
          height: 100%;
          margin-right: 18px;

          position: relative;
          display: flex;
          align-items: center;
        }
        .f1-world {
          display: flex;
          align-items: center;
          white-space: pre;
          will-change: transform;

        .f1-typed {
          display: inline-block;
          white-space: pre;
          font-family: "Inter", sans-serif;

        .f1-caret {

        .f1-send {
          flex: none;
          width: 84px;
          height: 84px;
          border-radius: 50%;
          background: #2BD97C;
          display: grid;
          place-items: center;
        }

        /* Sent-bubble skin — dark green-tinted gradient, fades in over last 40% of morph */
        .f1-bubble-grad {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, #0E2A20 0%, #14382A 100%);
          opacity: 0;
        }
        /* Sent-bubble content — WHITE text */
        .f1-bubble-text {
          position: absolute;
          left: 0;
          top: 0;
          width: 660px;
          height: 168px;
          padding: 30px 34px;
          font-family: "Inter", sans-serif;
          font-size: 36px;
          font-weight: 500;
          line-height: 1.45;
          color: #FFFFFF;
          opacity: 0;
        }

        /* Finger-sized tap highlight + ripple over the send button (no arrow cursor) */
        .f1-tap {
          position: absolute;
          left: 866px;
          top: 638px;
          width: 116px;
          height: 116px;
          border-radius: 50%;
          background: rgba(43, 217, 124, 0.28);
          opacity: 0;
          pointer-events: none;
        }
        .f1-ripple {
          position: absolute;
          left: 866px;
          top: 638px;
          width: 116px;
          height: 116px;
          border-radius: 50%;
          border: 2.5px solid rgba(43, 217, 124, 0.9);
          opacity: 0;
          pointer-events: none;
        }

        /* Buddi typing indicator — the cliffhanger, lower-left */
        .f1-indicator {
          position: absolute;
          left: 100px;
          top: 700px;
          display: flex;
          align-items: center;
          gap: 18px;
          opacity: 0;
        }
        .f1-avatar {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: #2BD97C;
          flex: none;
        }
        .f1-buddi-name {
          font-family: "Inter", sans-serif;
          font-size: 32px;
          font-weight: 700;
          color: #F2F5F4;
        }
        .f1-dots {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-left: 6px;
        }
        .f1-dot {
          width: 13px;
          height: 13px;
          border-radius: 50%;
          background: #2BD97C;
          opacity: 0.25;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-no-clue-sentence"
        data-width="1080"
        data-height="1920"
      >
        <div class="f1-bg clip" data-start="0" data-duration="9.408" data-track-index="0"></div>

        <div class="f1-cam clip" data-start="0" data-duration="9.408" data-track-index="1">
          <!-- TOP STEPPER: Find stocks —— Build the strategy —— Test live -->
          <div class="f1-stepper" id="f1-stepper">
            <div class="f1-step">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#2BD97C" stroke-width="2" />
                <path
                  d="M8 12.4l2.6 2.6 5.4-5.6"
                  stroke="#2BD97C"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="f1-step-label">Find stocks</span>
            </div>
            <div class="f1-step-line"></div>
            <div class="f1-step">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#2BD97C" stroke-width="2" />
                <path
                  d="M8 12.4l2.6 2.6 5.4-5.6"
                  stroke="#2BD97C"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="f1-step-label">Build the strategy</span>
            </div>
            <div class="f1-step-line"></div>
            <div class="f1-step">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path
                  d="M2 12h4l3-8 6 16 3-8h4"
                  stroke="#A8B3AE"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="f1-step-label">Test live</span>
            </div>
          </div>

          <!-- CHAT INPUT (hero) → morphs into the sent user bubble -->
          <div class="f1-pill" id="f1-pill">
            <div class="f1-input-inner" id="f1-input-inner">
              <div class="f1-viewport">
                <div class="f1-world" id="f1-world">
                  <span class="f1-typed" id="f1-typed"></span><span class="f1-caret" id="f1-caret"></span>
                </div>
              </div>
              <div class="f1-send" id="f1-send">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 19V5M5 12l7-7 7 7"
                    stroke="#FFFFFF"
                    stroke-width="2.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
            <div class="f1-bubble-grad" id="f1-bubble-grad"></div>
            <div class="f1-bubble-text" id="f1-bubble-text">
              I have $1,000 and have no clue what to do with it
            </div>
          </div>

          <div class="f1-ripple" id="f1-ripple"></div>
          <div class="f1-tap" id="f1-tap"></div>

          <!-- Buddi typing indicator: teal avatar + "Buddi" + pulsing dots -->
          <div class="f1-indicator" id="f1-indicator">
            <div class="f1-avatar"></div>
            <div class="f1-buddi-name">Buddi</div>
            <div class="f1-dots">
              <div class="f1-dot"></div>
              <div class="f1-dot"></div>
              <div class="f1-dot"></div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const D = 9.408; // frame duration, synced to voice 01.wav

        /* ---- key beats (paced to the spoken line across 9.408s) ----
           "I had $1,000 sitting in cash — and no clue what to do with it."  ~0.0–5.3
           "So I typed that exact sentence"                                  ~5.4–7.2  → tap + send
           "into an AI."                                                     ~7.3–9.4  → sent bubble + Buddi typing dots */
        const TYPE_START = 0.42;
        const MORPH_START = 6.5;
        const MORPH_DUR = 1.0;
        const TAP_IN = 5.95;
        const PRESS_AT = 6.14;
        const PRESS_DUR = 0.09;
        const RELEASE_AT = PRESS_AT + PRESS_DUR;

        /* ---- discrete-text-sequence: human keystroke schedule (deterministic) ---- */
        const TXT = "I have $1,000 and have no clue what to do with it"; // exact product wording
        const JIT = [0.018, -0.012, 0.026, 0.004, -0.018, 0.031, -0.006, 0.012]; // fixed jitter table — no Math.random
        const SEQ = [{ t: 0, n: 0 }];
        let acc = TYPE_START;
        for (let i = 1; i <= TXT.length; i++) {
          let d = 0.072 + JIT[i % JIT.length];
          if (TXT[i - 1] === " ") d += 0.048; // word-break breath
          acc += d;
          SEQ.push({ t: acc, n: i });
          if (i === 13) acc += 0.4; // thinking pause after "$1,000"
          if (i === 30) acc += 0.26; // thinking pause after "no clue"
        }

        const typedEl = document.getElementById("f1-typed");
        const caretEl = document.getElementById("f1-caret");
        const worldEl = document.getElementById("f1-world");

        /* camera-cursor-tracking (ticker push): caret pinned near frame-center.
           Pill left 100 + inner pad 44 → viewport origin x=144; frame center 540 → pin at 396. */
        const PIN = 396;
        const BLINK_PERIOD = 0.9;
        const TYPING_GRACE = 0.22;

        /* Single driver — text state, ticker shift, caret blink are all pure functions
           of driver.t (seek-safe; re-measured per frame per the tracking rule). */
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;
              let idx = 0;
              for (let i = SEQ.length - 1; i >= 0; i--) {
                if (t >= SEQ[i].t) {
                  idx = i;
                  break;
                }
              }
              typedEl.textContent = TXT.slice(0, SEQ[idx].n);
              const w = typedEl.offsetWidth;
              gsap.set(worldEl, { x: Math.min(0, PIN - (w + 10)) });
              // caret: solid while typing, deterministic sin blink while idle, gone once sent
              let vis = 0;
              if (t < MORPH_START) {
                const typing = idx > 0 && t - SEQ[idx].t < TYPING_GRACE;
                vis = typing
                  ? 1
                  : Math.sin(((t + 0.24) * Math.PI * 2) / BLINK_PERIOD) > 0
                    ? 1
                    : 0;
              }
              caretEl.style.opacity = vis;
            },
          },
          0,
        );

        /* ---- Scene 1: chrome + input bar settle in, sentence types on (hero visible < 0.5s) ---- */
        tl.fromTo(
          "#f1-stepper",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.06,
        );
        tl.fromTo(
          "#f1-pill",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.02,
        );

        // gentle assembly drift leftward + slight scale — the "camera" of the ticker push
        tl.fromTo(
          ".f1-cam",
          { x: 0, scale: 1 },
          { x: -24, scale: 1.02, duration: 3.2, ease: "power1.inOut" },
          2.2,
        );

        /* ---- Scene 2: thumb tap on send (cursor-click-ripple, tap variant) ---- */
        tl.fromTo(
          "#f1-tap",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
          TAP_IN,
        );

        // press-release-spring: linear compression in, spring recovery out
        tl.to("#f1-tap", { scale: 0.84, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f1-send", { scale: 0.9, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f1-send", { scale: 1, duration: 0.55, ease: "back.out(1.8)" }, RELEASE_AT); // the one sanctioned spring-pop
        tl.to(
          "#f1-tap",
          { opacity: 0, scale: 1.05, duration: 0.28, ease: "power2.out" },
          RELEASE_AT + 0.04,
        );

        // ripple bloom from the click point
        tl.fromTo(
          "#f1-ripple",
          { scale: 0.35, opacity: 0.85 },
          {
            scale: 3.3,
            opacity: 0,
            duration: 0.65,
            ease: "power2.out",
            immediateRender: false,
          },
          RELEASE_AT,
        );

        /* ---- card-morph-anchor: input bar lifts and morphs into the SENT user bubble ----
           Final seat: right-aligned upper-right — left 340 (right edge 1000), top 380, 660×168, r24 */
        tl.to(
          "#f1-pill",
          {
            x: 240,
            y: -260,
            width: 660,
            height: 168,
            borderRadius: 24,
            backgroundColor: "#0E2A20",
            borderColor: "rgba(43,217,124,0.35)",
            duration: MORPH_DUR,
            ease: "power2.inOut",
          },
          MORPH_START,
        );
        // camera settles back to neutral with the send
        tl.to(".f1-cam", { x: 0, scale: 1, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
        // old content fades during the first 40% of the morph
        tl.to(
          "#f1-input-inner",
          { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" },
          MORPH_START,
        );
        // new skin (green-tinted gradient) + WHITE text fade in during the last 40%
        tl.fromTo(
          "#f1-bubble-grad",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );
        tl.fromTo(
          "#f1-bubble-text",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );

        /* ---- Scene 3: Buddi typing indicator — the cliffhanger. Still otherwise. ---- */
        tl.fromTo(
          "#f1-indicator",
          { opacity: 0, y: 16, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          7.78,
        );
        // finite staggered dot pulses (no loop) — ends inside the frame
        tl.fromTo(
          ".f1-dot",
          { opacity: 0.25 },
          {
            opacity: 1,
            duration: 0.24,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 3,
            stagger: 0.18,
            immediateRender: false,
          },
          8.06,
        );

        window.__timelines["01-no-clue-sentence"] = tl;
      </script>
    </template>
