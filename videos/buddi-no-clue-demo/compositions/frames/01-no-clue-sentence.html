<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 1 — The no-clue sentence · typewriter-reveal (Hook, ticker-push, send→sent-bubble resolve) -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter", sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        /* Full-bleed cream ground — dedicated clip, never on #root */
        .f1-bg {
          position: absolute;
          inset: 0;
          background: #fdfae7;
        }

        /* Camera group — gentle leftward drift + slight scale while typing */
        .f1-cam {
          position: absolute;
          inset: 0;
        }

        /* Chat-input pill — the hero. Morphs into the sent bubble. */
        .f1-pill {
          position: absolute;
          left: 80px;
          top: 680px;
          width: 920px;
          height: 140px;
          background: rgba(30, 43, 250, 0.04);
          border: 1.5px solid rgba(30, 43, 250, 0.2);
          border-radius: 70px;
          overflow: hidden;
          opacity: 0;
        }
        .f1-input-inner {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          padding: 0 24px 0 52px;
        }
        .f1-viewport {
          flex: 1;
          height: 100%;
          margin-right: 20px;
          overflow: hidden;
          position: relative;
          display: flex;
          align-items: center;
        }
        .f1-world {
          display: flex;
          align-items: center;
          white-space: pre;
          will-change: transform;
        }
        .f1-typed {
          display: inline-block;
          white-space: pre;
          font-family: "Space Grotesk", sans-serif;
          font-size: 46px;
          font-weight: 500;
          letter-spacing: -0.01em;
          color: #111111;
          line-height: 1;
        }
        .f1-caret {
          display: inline-block;
          width: 4.5px;
          height: 54px;
          margin-left: 7px;
          border-radius: 2px;
          background: #1e2bfa;
        }
        .f1-send {
          flex: none;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: #1e2bfa;
          display: grid;
          place-items: center;
        }
        /* Sent-bubble content — fades in during the last 40% of the morph */
        .f1-bubble-text {
          position: absolute;
          left: 0;
          top: 0;
          width: 680px;
          height: 170px;
          padding: 27px 34px;
          font-family: "Inter", sans-serif;
          font-size: 38px;
          font-weight: 500;
          line-height: 1.42;
          color: #fdfae7;
          opacity: 0;
        }

        /* Finger-sized tap highlight + ripple over the send button (no arrow cursor) */
        .f1-tap {
          position: absolute;
          left: 868px;
          top: 690px;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          background: rgba(30, 43, 250, 0.16);
          opacity: 0;
          pointer-events: none;
        }
        .f1-ripple {
          position: absolute;
          left: 868px;
          top: 690px;
          width: 120px;
          height: 120px;
          border-radius: 50%;
          border: 2.5px solid rgba(30, 43, 250, 0.55);
          opacity: 0;
          pointer-events: none;
        }

        /* Buddi typing indicator — the cliffhanger, lower-left */
        .f1-indicator {
          position: absolute;
          left: 80px;
          top: 780px;
          width: 176px;
          height: 96px;
          background: rgba(30, 43, 250, 0.04);
          border: 1.5px solid rgba(30, 43, 250, 0.2);
          border-radius: 24px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          opacity: 0;
        }
        .f1-dot {
          width: 16px;
          height: 16px;
          border-radius: 50%;
          background: #1e2bfa;
          opacity: 0.25;
        }
      </style>

      <div
        id="root"
        data-composition-id="01-no-clue-sentence"
        data-width="1080"
        data-height="1920"
      >
        <div class="f1-bg clip" data-start="0" data-duration="9.408" data-track-index="0"></div>

        <div class="f1-cam clip" data-start="0" data-duration="9.408" data-track-index="1">
          <div class="f1-pill" id="f1-pill">
            <div class="f1-input-inner" id="f1-input-inner">
              <div class="f1-viewport">
                <div class="f1-world" id="f1-world">
                  <span class="f1-typed" id="f1-typed"></span><span class="f1-caret" id="f1-caret"></span>
                </div>
              </div>
              <div class="f1-send" id="f1-send">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 19V5M5 12l7-7 7 7"
                    stroke="#fdfae7"
                    stroke-width="2.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
            <div class="f1-bubble-text" id="f1-bubble-text">
              I have $1,000 and no clue what to do with it
            </div>
          </div>

          <div class="f1-ripple" id="f1-ripple"></div>
          <div class="f1-tap" id="f1-tap"></div>

          <div class="f1-indicator" id="f1-indicator">
            <div class="f1-dot"></div>
            <div class="f1-dot"></div>
            <div class="f1-dot"></div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const D = 9.408; // frame duration, synced to voice 01.wav

        /* ---- key beats (paced to the spoken line across 9.408s) ----
           "I had $1,000 sitting in cash — and no clue what to do with it."  ~0.0–5.3
           "So I typed that exact sentence"                                  ~5.4–7.2  → tap + send
           "into an AI."                                                     ~7.3–9.4  → sent bubble + Buddi typing dots */
        const TYPE_START = 0.42;
        const MORPH_START = 6.5;
        const MORPH_DUR = 1.0;
        const TAP_IN = 5.95;
        const PRESS_AT = 6.14;
        const PRESS_DUR = 0.09;
        const RELEASE_AT = PRESS_AT + PRESS_DUR;

        /* ---- discrete-text-sequence: human keystroke schedule (deterministic) ---- */
        const TXT = "I have $1,000 and no clue what to do with it";
        const JIT = [0.018, -0.012, 0.026, 0.004, -0.018, 0.031, -0.006, 0.012]; // fixed jitter table — no Math.random
        const SEQ = [{ t: 0, n: 0 }];
        let acc = TYPE_START;
        for (let i = 1; i <= TXT.length; i++) {
          let d = 0.078 + JIT[i % JIT.length];
          if (TXT[i - 1] === " ") d += 0.05; // word-break breath
          acc += d;
          SEQ.push({ t: acc, n: i });
          if (i === 13) acc += 0.42; // thinking pause after "$1,000"
          if (i === 25) acc += 0.28; // thinking pause after "clue"
        }

        const typedEl = document.getElementById("f1-typed");
        const caretEl = document.getElementById("f1-caret");
        const worldEl = document.getElementById("f1-world");

        /* camera-cursor-tracking (ticker push): caret pinned near frame-center.
           Pill left 80 + inner pad 52 → viewport origin x=132; frame center 540 → pin at 408. */
        const PIN = 408;
        const BLINK_PERIOD = 0.9;
        const TYPING_GRACE = 0.22;

        /* Single driver — text state, ticker shift, caret blink are all pure functions
           of driver.t (seek-safe; re-measured per frame per the tracking rule). */
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;
              let idx = 0;
              for (let i = SEQ.length - 1; i >= 0; i--) {
                if (t >= SEQ[i].t) {
                  idx = i;
                  break;
                }
              }
              typedEl.textContent = TXT.slice(0, SEQ[idx].n);
              const w = typedEl.offsetWidth;
              gsap.set(worldEl, { x: Math.min(0, PIN - (w + 10)) });
              // caret: solid while typing, deterministic sin blink while idle, gone once sent
              let vis = 0;
              if (t < MORPH_START) {
                const typing = idx > 0 && t - SEQ[idx].t < TYPING_GRACE;
                vis = typing
                  ? 1
                  : Math.sin(((t + 0.24) * Math.PI * 2) / BLINK_PERIOD) > 0
                    ? 1
                    : 0;
              }
              caretEl.style.opacity = vis;
            },
          },
          0,
        );

        /* ---- Scene 1: pill settles in, sentence types on (hero visible < 0.5s) ---- */
        tl.fromTo(
          "#f1-pill",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.02,
        );

        // gentle assembly drift leftward + slight scale — the "camera" of the ticker push
        tl.fromTo(
          ".f1-cam",
          { x: 0, scale: 1 },
          { x: -24, scale: 1.02, duration: 3.2, ease: "power1.inOut" },
          2.2,
        );

        /* ---- Scene 2: thumb tap on send (cursor-click-ripple, tap variant) ---- */
        tl.fromTo(
          "#f1-tap",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
          TAP_IN,
        );

        // press-release-spring: linear compression in, spring recovery out
        tl.to("#f1-tap", { scale: 0.84, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f1-send", { scale: 0.9, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f1-send", { scale: 1, duration: 0.55, ease: "back.out(1.8)" }, RELEASE_AT); // the one sanctioned spring-pop
        tl.to(
          "#f1-tap",
          { opacity: 0, scale: 1.05, duration: 0.28, ease: "power2.out" },
          RELEASE_AT + 0.04,
        );

        // ripple bloom from the click point
        tl.fromTo(
          "#f1-ripple",
          { scale: 0.35, opacity: 0.85 },
          {
            scale: 3.3,
            opacity: 0,
            duration: 0.65,
            ease: "power2.out",
            immediateRender: false,
          },
          RELEASE_AT,
        );

        /* ---- card-morph-anchor: input pill lifts and morphs into the SENT cobalt bubble ---- */
        tl.to(
          "#f1-pill",
          {
            x: 264,
            y: -280,
            width: 680,
            height: 170,
            borderRadius: 26,
            backgroundColor: "#1e2bfa",
            borderColor: "rgba(30,43,250,0)",
            duration: MORPH_DUR,
            ease: "power2.inOut",
          },
          MORPH_START,
        );
        // camera settles back to neutral with the send
        tl.to(".f1-cam", { x: 0, scale: 1, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
        // old content fades during the first 40% of the morph
        tl.to(
          "#f1-input-inner",
          { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" },
          MORPH_START,
        );
        // new content fades in during the last 40%
        tl.fromTo(
          "#f1-bubble-text",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );

        /* ---- Scene 3: Buddi typing indicator — the cliffhanger. Still otherwise. ---- */
        tl.fromTo(
          "#f1-indicator",
          { opacity: 0, y: 16, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "power3.out" },
          7.78,
        );
        // finite staggered dot pulses (no loop) — ends inside the frame
        tl.fromTo(
          ".f1-dot",
          { opacity: 0.25 },
          {
            opacity: 1,
            duration: 0.24,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 3,
            stagger: 0.18,
            immediateRender: false,
          },
          8.06,
        );

        window.__timelines["01-no-clue-sentence"] = tl;
      </script>
    </template>
  </body>
</html>
