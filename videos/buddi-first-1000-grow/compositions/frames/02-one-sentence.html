    <!-- Frame 2 — One sentence into Buddi · typewriter-reveal (Reproduce — product-input variant)

  <body>
    <template>
      <style>
        @font-face {

        @font-face {

        #root {
          position: absolute;
          inset: 0;

        /* Full-bleed near-black ground — dedicated clip, never painted on #root */
        .f2-bg {
          position: absolute;

          background: #0B0E11;
        }

        /* Camera group — gentle leftward drift + slight scale during the typing push */
        .f2-cam {
          position: absolute;
          inset: 0;
        }

        /* ---- TOP STEPPER — app chrome: Find stocks — Build the strategy — Test live ---- */
        .f2-stepper {
          position: absolute;
          left: 56px;
          right: 56px;
          top: 88px;
          height: 44px;
          display: flex;
          align-items: center;
          gap: 16px;
          opacity: 0;
        }
        .f2-step {
          display: flex;
          align-items: center;

        .f2-step-label {

        /* ---- CHAT INPUT — the hero. Morphs into the sent user bubble. ---- */
        .f2-pill {
          position: absolute;
          left: 100px;
          top: 660px;
          width: 880px;
          height: 112px;
          background: #12171B;
          border: 1px solid #262D33;
          border-radius: 28px;
          overflow: hidden;
          opacity: 0;
        }
        .f2-input-inner {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          padding: 0 16px 0 44px;
        }
        .f2-viewport {
          flex: 1;
          height: 100%;
          margin-right: 18px;
          overflow: hidden;
          position: relative;
          display: flex;
          align-items: center;
        }
        .f2-placeholder {
          position: absolute;
          left: 18px;
          top: 50%;
          margin-top: -24px;
          height: 48px;
          line-height: 48px;
          font-family: "Inter", sans-serif;
          font-size: 38px;
          font-weight: 400;
          letter-spacing: -0.01em;
          color: #76837C;
          white-space: nowrap;
          pointer-events: none;
        }
        .f2-world {
          display: flex;
          align-items: center;
          white-space: pre;
          will-change: transform;
        }
        .f2-typed {
          display: inline-block;
          white-space: pre;
          font-family: "Inter", sans-serif;
          font-size: 40px;
          font-weight: 450;
          letter-spacing: -0.01em;
          color: #F2F5F4;

        }
        .f2-caret {
          display: inline-block;
          width: 4px;
          height: 48px;
          margin-left: 6px;
          border-radius: 2px;
          background: #2BD97C;
        }
        .f2-send {
          flex: none;
          width: 84px;
          height: 84px;
          border-radius: 50%;
          background: #2BD97C;
          display: grid;
          place-items: center;
        }

        /* Sent-bubble skin — dark green-tinted gradient, fades in over the last 40% of the morph */
        .f2-bubble-grad {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, #0E2A20 0%, #14382A 100%);
          opacity: 0;
        }
        /* Sent-bubble content — WHITE text */
        .f2-bubble-text {
          position: absolute;
          left: 0;
          top: 0;
          width: 660px;
          height: 168px;
          padding: 28px 34px;
          font-family: "Inter", sans-serif;
          font-size: 36px;
          font-weight: 500;
          line-height: 1.45;
          color: #FFFFFF;
          opacity: 0;
        }

        /* Finger-sized tap highlight + ripple over the send button (no arrow cursor) */
        .f2-tap {
          position: absolute;
          left: 864px;
          top: 658px;
          width: 116px;
          height: 116px;
          border-radius: 50%;
          background: rgba(43, 217, 124, 0.28);
          opacity: 0;
          pointer-events: none;
        }
        .f2-ripple {
          position: absolute;
          left: 864px;
          top: 658px;
          width: 116px;
          height: 116px;
          border-radius: 50%;
          border: 2.5px solid rgba(43, 217, 124, 0.9);
          opacity: 0;
          pointer-events: none;
        }

        /* Buddi typing indicator — the cliffhanger, lower-left */
        .f2-indicator {
          position: absolute;
          left: 100px;
          top: 700px;
          display: flex;
          align-items: center;
          gap: 18px;
          opacity: 0;
        }
        .f2-avatar {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: #2BD97C;
          flex: none;
        }
        .f2-buddi-name {
          font-family: "Inter", sans-serif;
          font-size: 32px;
          font-weight: 700;
          color: #F2F5F4;
        }
        .f2-dots {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-left: 6px;
        }
        .f2-dot {
          width: 13px;
          height: 13px;
          border-radius: 50%;
          background: #2BD97C;
          opacity: 0.25;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-one-sentence"
        data-width="1080"
        data-height="1920"
      >
        <div class="f2-bg clip" data-start="0" data-duration="6.955" data-track-index="0"></div>

        <div class="f2-cam clip" data-start="0" data-duration="6.955" data-track-index="1">
          <!-- TOP STEPPER: first check green, later steps muted -->
          <div class="f2-stepper" id="f2-stepper">
            <div class="f2-step">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#2BD97C" stroke-width="2" />
                <path
                  id="f2-check"
                  d="M8 12.4l2.6 2.6 5.4-5.6"
                  stroke="#2BD97C"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-dasharray="14"
                />
              </svg>
              <span class="f2-step-label">Find stocks</span>
            </div>
            <div class="f2-step-line"></div>
            <div class="f2-step">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#3A444B" stroke-width="2" />
              </svg>
              <span class="f2-step-label f2-step-label-muted">Build the strategy</span>
            </div>
            <div class="f2-step-line"></div>
            <div class="f2-step">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                <path
                  d="M2 12h4l3-8 6 16 3-8h4"
                  stroke="#A8B3AE"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="f2-step-label f2-step-label-muted">Test live</span>
            </div>
          </div>

          <!-- CHAT INPUT (hero) → morphs into the sent user bubble -->
          <div class="f2-pill" id="f2-pill">
            <div class="f2-input-inner" id="f2-input-inner">
              <div class="f2-viewport">
                <div class="f2-placeholder" id="f2-placeholder">Ask Buddi anything</div>
                <div class="f2-world" id="f2-world">
                  <span class="f2-typed" id="f2-typed"></span><span class="f2-caret" id="f2-caret"></span>
                </div>
              </div>
              <div class="f2-send" id="f2-send">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                  <path
                    d="M12 19V5M5 12l7-7 7 7"
                    stroke="#FFFFFF"
                    stroke-width="2.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
            <div class="f2-bubble-grad" id="f2-bubble-grad"></div>
            <div class="f2-bubble-text" id="f2-bubble-text">
              I've got $1,000 and no idea what to do with it
            </div>
          </div>

          <div class="f2-ripple" id="f2-ripple"></div>
          <div class="f2-tap" id="f2-tap"></div>

          <!-- Buddi typing indicator: green avatar + "Buddi" + pulsing dots -->
          <div class="f2-indicator" id="f2-indicator">
            <div class="f2-avatar"></div>
            <div class="f2-buddi-name">Buddi</div>
            <div class="f2-dots">
              <div class="f2-dot"></div>
              <div class="f2-dot"></div>
              <div class="f2-dot"></div>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const D = 6.955; // frame duration, synced to voice 02.wav

        /* ---- key voice cues (audio_meta.json, frame 2) ----
           "Here's the move."                          0.10–0.83  → chrome + input settle
           "Instead of you guessing, you tell an AI
            called Buddi"                              1.09–3.20  → caret blinks, camera leans in
           "one sentence:"                             3.20–3.89  → typing begins (speed-ramped ~1.5x)
           "I've got $1,000 … what to do with it."     4.03–6.50  → typed line runs under the spoken one,
                                                                     send tap → user bubble → Buddi dots */
        const TYPE_START = 3.08;
        const TAP_IN = 5.44;
        const PRESS_AT = 5.62;
        const PRESS_DUR = 0.09;
        const RELEASE_AT = PRESS_AT + PRESS_DUR;
        const MORPH_START = 5.82;
        const MORPH_DUR = 0.8;

        /* ---- discrete-text-sequence: speed-ramped (~1.5x) keystroke schedule (deterministic) ---- */
        const TXT = "I've got $1,000 and no idea what to do with it"; // Video B wording — matches bubble text
        const JIT = [0.012, -0.008, 0.017, 0.003, -0.012, 0.02, -0.004, 0.008]; // fixed jitter table — no Math.random
        const SEQ = [{ t: 0, n: 0 }];
        let acc = TYPE_START;
        for (let i = 1; i <= TXT.length; i++) {
          let d = 0.038 + JIT[i % JIT.length]; // ~1.5x faster than a relaxed 0.06–0.07s cadence
          if (TXT[i - 1] === " ") d += 0.02; // short word-break breath
          acc += d;
          SEQ.push({ t: acc, n: i });
          if (i === 15) acc += 0.12; // micro pause after "$1,000"
          if (i === 27) acc += 0.08; // micro pause after "idea"
        }

        const typedEl = document.getElementById("f2-typed");
        const caretEl = document.getElementById("f2-caret");
        const worldEl = document.getElementById("f2-world");

        /* camera-cursor-tracking (ticker push): caret pinned near frame-center.
           Pill left 100 + inner pad 44 → viewport origin x=144; frame center 540 → pin at 396. */
        const PIN = 396;
        const BLINK_PERIOD = 0.9;
        const TYPING_GRACE = 0.18;

        /* Single driver — text state, ticker shift, caret blink are all pure functions
           of driver.t (seek-safe; re-measured per frame per the tracking rule). */
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;
              let idx = 0;
              for (let i = SEQ.length - 1; i >= 0; i--) {
                if (t >= SEQ[i].t) {
                  idx = i;
                  break;
                }
              }
              typedEl.textContent = TXT.slice(0, SEQ[idx].n);
              const w = typedEl.offsetWidth;
              gsap.set(worldEl, { x: Math.min(0, PIN - (w + 10)) });
              // caret: solid while typing, deterministic sin blink while idle, gone once sent
              let vis = 0;
              if (t < MORPH_START) {
                const typing = idx > 0 && t - SEQ[idx].t < TYPING_GRACE;
                vis = typing
                  ? 1
                  : Math.sin(((t + 0.24) * Math.PI * 2) / BLINK_PERIOD) > 0
                    ? 1
                    : 0;
              }
              caretEl.style.opacity = vis;
            },
          },
          0,
        );

        /* ---- Scene 1 (0–1.6s): chrome + input bar settle in (hero visible < 0.5s) ---- */
        tl.fromTo(
          "#f2-pill",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.02,
        );
        tl.fromTo(
          "#f2-stepper",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.08,
        );
        // first stepper check strokes in — svg-path-draw micro-flourish on "the move"
        tl.fromTo(
          "#f2-check",
          { strokeDashoffset: 14 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.45,
        );

        /* ---- Scene 2 (on "one sentence"): typing push ---- */
        // gentle assembly drift leftward + slight scale — the "camera" of the ticker push
        tl.fromTo(
          ".f2-cam",
          { x: 0, scale: 1 },
          { x: -24, scale: 1.02, duration: 2.9, ease: "power1.inOut" },
          2.35,
        );
        // placeholder yields to the typed line
        tl.to(
          "#f2-placeholder",
          { opacity: 0, duration: 0.14, ease: "power1.in" },
          TYPE_START - 0.06,
        );
        // input border warms green as the sentence fills
        tl.to(
          "#f2-pill",
          { borderColor: "rgba(43,217,124,0.55)", duration: 2.1, ease: "power1.inOut" },
          TYPE_START,
        );

        /* ---- Scene 3: thumb tap on send (cursor-click-ripple, tap variant) ---- */
        tl.fromTo(
          "#f2-tap",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.16, ease: "power2.out" },
          TAP_IN,
        );

        // press-release-spring: linear compression in, spring recovery out
        tl.to("#f2-tap", { scale: 0.84, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f2-send", { scale: 0.9, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f2-send", { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, RELEASE_AT); // the one sanctioned spring-pop
        tl.to(
          "#f2-tap",
          { opacity: 0, scale: 1.05, duration: 0.26, ease: "power2.out" },
          RELEASE_AT + 0.04,
        );

        // ripple bloom from the click point
        tl.fromTo(
          "#f2-ripple",
          { scale: 0.35, opacity: 0.85 },
          {
            scale: 3.2,
            opacity: 0,
            duration: 0.6,
            ease: "power2.out",
            immediateRender: false,
          },
          RELEASE_AT,
        );

        /* ---- card-morph-anchor: input bar lifts and morphs into the SENT user bubble ----
           Final seat: right-aligned — left 340 (right edge 1000), top 400, 660×168, r24 */
        tl.to(
          "#f2-pill",
          {
            x: 240,
            y: -260,
            width: 660,
            height: 168,
            borderRadius: 24,
            backgroundColor: "#0E2A20",
            borderColor: "rgba(43,217,124,0.35)",
            duration: MORPH_DUR,
            ease: "power2.inOut",
          },
          MORPH_START,
        );
        // camera settles back to neutral with the send
        tl.to(".f2-cam", { x: 0, scale: 1, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);
        // old content fades during the first 40% of the morph
        tl.to(
          "#f2-input-inner",
          { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in" },
          MORPH_START,
        );
        // new skin (green-tinted gradient) + WHITE text fade in during the last 40%
        tl.fromTo(
          "#f2-bubble-grad",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );
        tl.fromTo(
          "#f2-bubble-text",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );

        /* ---- Buddi typing indicator — the handoff to Frame 3. Settle otherwise. ---- */
        tl.fromTo(
          "#f2-indicator",
          { opacity: 0, y: 16, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" },
          6.42,
        );
        // finite staggered dot pulse (no loop) — ends inside the frame
        tl.fromTo(
          ".f2-dot",
          { opacity: 0.25 },
          {
            opacity: 1,
            duration: 0.12,
            ease: "sine.inOut",
            yoyo: true,
            repeat: 1,
            stagger: 0.07,
            immediateRender: false,
          },
          6.58,
        );

        window.__timelines["02-one-sentence"] = tl;
      </script>
    </template>
  </body>
