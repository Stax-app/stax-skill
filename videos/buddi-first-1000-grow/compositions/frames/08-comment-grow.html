<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 8 — Comment GROW (CTA, FINAL frame / end card). Everything the runtime needs lives inside <template>. -->
  </head>
  <body>
    <template>
      <script src="assets/vendor/gsap.min.js"></script>

      <style>
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2");
          font-weight: 300 800;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2");
          font-weight: 300 800;
          font-display: block;
        }

        /* Root styled via #root (scoper special-case) — no background here; the ground is a clip. */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "Inter", system-ui, sans-serif;
        }

        /* ---- Track 0: full-bleed dark ground + closing-rings atmosphere ---- */
        .cg-bg {
          position: absolute;
          inset: 0;
          background: #0b0e11;
          z-index: 0;
        }
        #cg-rings {
          position: absolute;
          inset: 0;
          transform-origin: 540px 660px; /* content-zone center — rings breathe around the CTA stack */
          will-change: transform, opacity;
        }
        .cg-ring {
          position: absolute;
          border-radius: 50%;
          border: 1.5px solid rgba(43, 217, 124, 0.12);
        }
        #cg-ring-1 {
          width: 700px;
          height: 700px;
          left: 190px;
          top: 310px;
          border-color: rgba(43, 217, 124, 0.2);
        }
        #cg-ring-2 {
          width: 1000px;
          height: 1000px;
          left: 40px;
          top: 160px;
          border-color: rgba(43, 217, 124, 0.13);
        }
        #cg-ring-3 {
          width: 1160px;
          height: 1160px;
          left: -40px;
          top: 80px; /* bottom edge 1240 — stays above the y=1250 content keep-out / y1290 caption band */
          border-color: rgba(43, 217, 124, 0.08);
        }

        /* ---- Track 1: the CTA stack (ALL content held above y=1250; captions burn at y1290–1440) ---- */
        .cg-stack {
          position: absolute;
          inset: 0;
          z-index: 1;
        }

        /* Beat 1 — "Comment" h1 slams dead-center */
        #cg-h1 {
          position: absolute;
          top: 300px;
          left: 0;
          width: 1080px;
          text-align: center;
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-weight: 700;
          font-size: 160px;
          line-height: 1.05;
          letter-spacing: -0.02em;
          color: #f2f5f4;
          will-change: transform, filter, opacity;
        }

        /* Beat 2 — the comment-input pill (tinted card, pill radius, no shadow) */
        #cg-pill {
          position: absolute;
          top: 520px;
          left: 0;
          right: 0;
          margin: 0 auto;
          width: 600px;
          height: 140px;
          border-radius: 100px;
          background: rgba(43, 217, 124, 0.1);
          border: 1.5px solid rgba(43, 217, 124, 0.4);
          display: flex;
          align-items: center;
          justify-content: center;
          will-change: transform, opacity;
        }
        .cg-type-wrap {
          width: 218px; /* fixed measure >= final "GROW" width — no right-edge jitter while typing */
          text-align: left;
          white-space: nowrap;
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-weight: 700;
          font-size: 64px;
          letter-spacing: 0.04em;
          color: #f2f5f4;
          line-height: 1;
        }
        #cg-caret {
          display: inline-block;
          width: 5px;
          height: 54px;
          margin-left: 7px;
          vertical-align: -6px;
          background: #2bd97c;
          opacity: 0; /* deterministic sin-blink driver owns this */
        }

        /* Beat 3 — big green down-arrow (inline SVG — no emoji font on the render box) */
        #cg-arrow {
          position: absolute;
          top: 704px;
          left: 0;
          right: 0;
          margin: 0 auto;
          width: 176px;
          height: 224px;
          will-change: transform, opacity;
        }
        #cg-arrow svg {
          display: block;
          width: 100%;
          height: 100%;
        }

        /* Beat 4 — muted "free" scope sub-line */
        #cg-sub {
          position: absolute;
          top: 960px;
          left: 0;
          width: 1080px;
          text-align: center;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 400;
          font-size: 38px;
          line-height: 1.4;
          color: #a8b3ae;
          will-change: transform, opacity;
        }
        #cg-sub .cg-free {
          color: #2bd97c;
          font-weight: 600;
        }

        /* Beat 5 — lowercase buddi wordmark (typeset; no logo file exists) */
        #cg-wordmark {
          position: absolute;
          top: 1044px;
          left: 0;
          width: 1080px;
          text-align: center;
          font-family: "Space Grotesk", system-ui, sans-serif;
          font-weight: 700;
          font-size: 76px;
          line-height: 1.1;
          letter-spacing: -0.02em;
          color: #f2f5f4;
          text-transform: lowercase;
          will-change: transform, opacity;
        }

        /* Beat 6 — disclaimer fine print, seated just above the y=1250 keep-out */
        #cg-fine {
          position: absolute;
          top: 1158px;
          left: 90px;
          width: 900px;
          text-align: center;
          font-family: "Inter", system-ui, sans-serif;
          font-weight: 400;
          font-size: 20px;
          line-height: 1.3;
          color: #76837c;
          will-change: opacity;
        }
      </style>

      <div id="root" data-composition-id="08-comment-grow" data-width="1080" data-height="1920">
        <!-- Ground + closing-rings atmosphere (sanctioned on the closing frame only) -->
        <div class="cg-bg clip" data-start="0" data-duration="4.864" data-track-index="0">
          <div id="cg-rings">
            <div class="cg-ring" id="cg-ring-1"></div>
            <div class="cg-ring" id="cg-ring-2"></div>
            <div class="cg-ring" id="cg-ring-3"></div>
          </div>
        </div>

        <!-- CTA stack -->
        <div class="cg-stack clip" data-start="0" data-duration="4.864" data-track-index="1">
          <div id="cg-h1">Comment</div>

          <div id="cg-pill">
            <div class="cg-type-wrap"><span id="cg-type"></span><span id="cg-caret"></span></div>
          </div>

          <div id="cg-arrow">
            <svg viewBox="0 0 140 180" aria-hidden="true">
              <path
                d="M70 14 V128 M22 92 L70 146 L118 92"
                stroke="#2BD97C"
                stroke-width="26"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>

          <div id="cg-sub">building + paper trading on real prices = <span class="cg-free">free</span></div>

          <div id="cg-wordmark">buddi</div>

          <div id="cg-fine">
            For educational purposes only. Backtested results do not represent actual trading outcomes. Past performance is not indicative of future results. Not investment advice.
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- kinetic-type-beats (CTA variant) via kinetic-beat-slam: ONE beat array, distinct
        // entrances per element, then the end card locks DEAD STATIC to the final frame. ----
        // VO (4.864s): "Comment | 'GROW' | and I'll DM you the link | — building it and
        // paper-trading on real prices | is totally free."
        const BEATS = {
          h1: 0.1, // Scene 1 — "Comment" slams as the word is spoken
          pill: 1.0, // Scene 2 — the comment pill spring-pops
          type: 1.15, // "GROW" types into the pill
          arrow: 1.7, // "and I'll DM you" — the down-arrow drops in
          sub: 2.25, // Scene 3 — the "free" scope line fades up
          mark: 2.55, // wordmark seats at the stack's foot
          fine: 2.8, // disclaimer fine print holds above the caption band
        };
        // All motion resolves by ~3.2s → the end card holds dead static for the final ~1.7s
        // (no breath, no pulse — the lock IS the shot; frame duration 4.864s is fixed).

        // Rings ground: quiet settle-in behind everything, then dead still.
        tl.fromTo(
          "#cg-rings",
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
          0,
        );

        // Beat 1 — "Comment" slams in dead-center (scale + blur, hard attack). Hero visible < 0.5s.
        tl.fromTo(
          "#cg-h1",
          { scale: 1.45, opacity: 0, filter: "blur(14px)" },
          { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
          BEATS.h1,
        );

        // Beat 2 — the comment pill spring-pops (smooth long-tail settle, no overshoot).
        tl.fromTo(
          "#cg-pill",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.pill,
        );

        // Beat 2b — "GROW" types character-by-character (smooth-slice typewriter).
        const CTA_WORD = "GROW";
        const typeEl = document.getElementById("cg-type");
        const typeLen = { v: 0 };
        tl.to(
          typeLen,
          {
            v: CTA_WORD.length,
            duration: 0.55,
            ease: "power1.inOut",
            onUpdate: () => {
              typeEl.textContent = CTA_WORD.substring(0, Math.floor(typeLen.v));
            },
          },
          BEATS.type,
        );

        // Caret — deterministic sin-blink from pill pop through the post-type beat,
        // ending at sin(4π)=0 → hidden, so the end card locks with no blinking.
        const caretEl = document.getElementById("cg-caret");
        const blink = { p: 0 };
        tl.to(
          blink,
          {
            p: Math.PI * 2 * 2,
            duration: 1.5,
            ease: "none",
            onUpdate: () => {
              caretEl.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
            },
          },
          BEATS.pill,
        );

        // Beat 3 — the big down-arrow drops in under the pill (hard snap, distinct ease).
        tl.fromTo(
          "#cg-arrow",
          { y: -80, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "expo.out" },
          BEATS.arrow,
        );

        // Beat 4 — the muted "free" scope line fades up.
        tl.fromTo(
          "#cg-sub",
          { y: 26, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
          BEATS.sub,
        );

        // Beat 5 — the buddi wordmark seats at the foot of the stack.
        tl.fromTo(
          "#cg-wordmark",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          BEATS.mark,
        );

        // Beat 6 — disclaimer fine print, quiet fade only. Last motion ends ~3.2s → DEAD STATIC hold.
        tl.fromTo(
          "#cg-fine",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out" },
          BEATS.fine,
        );

        window.__timelines["08-comment-grow"] = tl;
      </script>
    </template>
  </body>
</html>
