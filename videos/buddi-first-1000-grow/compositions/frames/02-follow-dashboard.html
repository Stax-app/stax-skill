      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* ---- key voice cues (audio_meta frame 2, × 6.848/10.411) ----
           "I'm Max, and this year"      0.07–0.85 → eyebrow + counter block land
           "I've built over 40"          0.85–2.10 → counter ROLLS 0→40, lands end of "40"
           "tested strategies"           2.10–2.74 → "+" pops; cascade finished, ticks set
           "without ever … on gut"       2.74–4.17 → the ONE finite upward scroll
           "so hit follow"               4.35–4.93 → Follow pill slides in, tap lands
           "if you want your money
            actually working."           4.93–6.47 → flip → Following ✓ draw → settle */
        const COUNT_START = 1.12;
        const COUNT_DUR = 0.95; // lands 2.07 ≈ end of the "40" cue
        const PLUS_AT = COUNT_START + COUNT_DUR;
        const SCROLL_AT = 2.8;
        const SCROLL_DUR = 1.52; // ends 4.32, just before "follow"
        const SCROLL_DIST = 810; // 5 card pitches of 162px — one finite translate
        const FOLLOW_IN = 4.38; // "so hit" — pill slides in
        const PRESS_AT = 4.86; // tap lands inside the "follow" word (4.66–4.93)
        const PRESS_DUR = 0.12;
        const RELEASE_AT = PRESS_AT + PRESS_DUR; // state continuity — adjacent, same prop
        const FLIP_AT = RELEASE_AT;

        /* ---- svg-path-draw setup: measure every tick path, park it undrawn ---- */
        const tickRings = gsap.utils.toArray(".f2b-tick-ring");
        const tickChecks = gsap.utils.toArray(".f2b-tick-check");
        const fcheckPath = document.getElementById("f2b-fcheck-path");
        [...tickRings, ...tickChecks, fcheckPath].forEach((p) => {
          const len = p.getTotalLength() * 1.02; // slight overestimate — safe for arcs
          p.style.strokeDasharray = `${len}`;
          p.style.strokeDashoffset = `${len}`;
        });

        /* ================= Scene 1 (0–2.74s) — header + counter + cascade ================= */
        // slow camera push-in underneath the whole shot (blueprint hold move)
        tl.fromTo(
          ".f2b-cam",
          { scale: 1, y: 0 },
          { scale: 1.028, y: -6, duration: D, ease: "power1.inOut" },
          0,
        );

        // eyebrow chrome lands on "I'm Max"
        tl.fromTo(
          "#f2b-eyebrow",
          { opacity: 0, y: -18 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.08,
        );
        // counter block rises on "and this year"
        tl.fromTo(
          "#f2b-counter-row",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.32,
        );

        // deterministic object-value counter — integer roll 0→40, landing on the "40" cue
        const count = { v: 0 };
        const countEl = document.getElementById("f2b-count-num");
        tl.fromTo(
          count,
          { v: 0 },
          {
            v: 40,
            duration: COUNT_DUR,
            ease: "power1.inOut",
            onUpdate: () => {
              countEl.textContent = String(Math.round(count.v));
            },
          },
          COUNT_START,
        );
        // "+" pops the instant the roll lands (the counter's payoff), row gives a tiny pulse
        tl.fromTo(
          "#f2b-count-plus",
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(2.4)", immediateRender: false },
          PLUS_AT,
        );
        tl.to("#f2b-counter-row", { scale: 1.05, duration: 0.12, ease: "power1.out" }, PLUS_AT);
        tl.to("#f2b-counter-row", { scale: 1, duration: 0.34, ease: "power2.out" }, PLUS_AT + 0.12);

        // stagger-assemble: first five cards slide a SHORT path directly into their slot
        // (dense-list form of center-outward-expansion — no scatter, no bounce)
        for (let i = 0; i < 5; i++) {
          const at = 0.55 + i * 0.16;
          tl.fromTo(
            "#f2b-card-" + i,
            { opacity: 0, y: 46, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" },
            at,
          );
          // tick draws as the card seats — ring first, check chases it (svg-path-draw)
          tl.to(
            "#f2b-card-" + i + " .f2b-tick-ring",
            { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
            at + 0.26,
          );
          tl.to(
            "#f2b-card-" + i + " .f2b-tick-check",
            { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
            at + 0.5,
          );
        }

        /* ================= Scene 2 (2.74–5.25s) — the ONE finite upward scroll ================= */
        tl.to(
          "#f2b-column",
          { y: -SCROLL_DIST, duration: SCROLL_DUR, ease: "power1.inOut" },
          SCROLL_AT,
        );
        // each passing card's tick draws as it crosses the window — staggered with the scroll
        for (let i = 5; i < 10; i++) {
          const at = 2.98 + (i - 5) * 0.27;
          tl.to(
            "#f2b-card-" + i + " .f2b-tick-ring",
            { strokeDashoffset: 0, duration: 0.34, ease: "power2.out" },
            at,
          );
          tl.to(
            "#f2b-card-" + i + " .f2b-tick-check",
            { strokeDashoffset: 0, duration: 0.26, ease: "power2.out" },
            at + 0.24,
          );
        }

        /* ================= Scene 3 (5.25s window opens at "hit follow") ================= */
        // Follow pill slides in from the right on "so hit"
        tl.fromTo(
          "#f2b-follow-wrap",
          { opacity: 0, x: 300 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" },
          FOLLOW_IN,
        );

        // finger-tap disc arrives over the button (cursor-click-ripple, tap variant)
        tl.fromTo(
          "#f2b-tap",
          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false },
          PRESS_AT - 0.14,
        );

        // press-release-spring: LINEAR compression in, spring recovery out
        tl.to("#f2b-pill", { scale: 0.92, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f2b-tap", { scale: 0.82, duration: PRESS_DUR, ease: "power1.in" }, PRESS_AT);
        tl.to("#f2b-pill", { scale: 1, duration: 0.55, ease: "back.out(2.2)" }, RELEASE_AT);
        tl.to("#f2b-tap", { scale: 1, duration: 0.3, ease: "back.out(1.6)" }, RELEASE_AT);
        tl.to("#f2b-tap", { opacity: 0, duration: 0.24, ease: "power1.in" }, RELEASE_AT + 0.1);

        // ripple ring radiates from the click point at release
        tl.fromTo(
          "#f2b-ripple",
          { opacity: 0.85, scale: 0.5 },
          { opacity: 0, scale: 2.7, duration: 0.62, ease: "power2.out", immediateRender: false },
          RELEASE_AT,
        );

        // the FLIP: solid green "Follow" → dark bordered "Following ✓" (state change at release)
        tl.to("#f2b-pill", { width: 356, duration: 0.32, ease: "power2.inOut" }, FLIP_AT);
        tl.to("#f2b-pill-follow", { opacity: 0, duration: 0.2, ease: "power1.in" }, FLIP_AT);
        tl.fromTo(
          "#f2b-pill-following",
          { opacity: 0 },
          { opacity: 1, duration: 0.26, ease: "power1.out", immediateRender: false },
          FLIP_AT + 0.08,
        );
        // the check DRAWS — the confirmation stamp (svg-path-draw)
        tl.to(
          "#f2b-fcheck-path",
          { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
          FLIP_AT + 0.2,
        );
        // soft environmental glow blooms behind the pill on release
        tl.to("#f2b-glow", { opacity: 0.85, duration: 0.6, ease: "power2.out" }, RELEASE_AT);

        // quiet ambient settle behind the shelf on "actually working" — then stillness
        tl.to("#f2b-settle-glow", { opacity: 1, duration: 0.75, ease: "power2.out" }, 5.75);

        window.__timelines["02-follow-dashboard"] = tl;
      </script>
    </template>
