      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var root = document.querySelector('[data-composition-id="05-questions-growth-own"]');
          var $ = function (id) { return document.getElementById(id); };

          var s1 = $("f5-s1"), s2 = $("f5-s2");
          var e1 = $("f5-e1"), e2 = $("f5-e2"), seam = $("f5-seam");
          var panL = $("f5-panL"), panR = $("f5-panR");
          var pinL = $("f5-pinL"), pinR = $("f5-pinR");
          var labL = $("f5-labL"), labR = $("f5-labR");
          var zz = [$("f5-zz1"), $("f5-zz2")];
          var coins = [$("f5-coin1"), $("f5-coin2"), $("f5-coin3")];
          var tap1 = $("f5-tap1"), tap2 = $("f5-tap2");
          var r1 = [$("f5-r1a"), $("f5-r1b")];
          var r2 = [$("f5-r2a"), $("f5-r2b")];
          var board = $("f5-board");
          var boxes = [$("f5-box1"), $("f5-box2"), $("f5-box3")];
          var crate1 = $("f5-crate1"), lid = $("f5-lid"), blab1 = $("f5-blab1");
          var sumhead = $("f5-sumhead");
          var sumpills = [$("f5-sum1"), $("f5-sum2")];
          var checkPaths = root.querySelectorAll(".f5-checkpath");

          // svg-path-draw setup — measure once (deterministic), park undrawn
          zz.forEach(function (p) {
            var len = p.getTotalLength();
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });
          checkPaths.forEach(function (p) {
            var len = p.getTotalLength();
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });

          var tl = gsap.timeline({ paused: true });

          // shared tap helper — finger highlight lands, presses, releases, ripples
          function tapIn(dot, at) {
            tl.fromTo(dot, { opacity: 0, scale: 0.5 },
              { opacity: 1, scale: 1, duration: 0.26, ease: "power2.out" }, at);
          }
          function rippleAt(rings, at) {
            rings.forEach(function (r, k) {
              tl.fromTo(r, { scale: 0.35, opacity: 0.75 },
                { scale: 2.4, opacity: 0, duration: 0.55, ease: "power2.out",
                  immediateRender: false }, at + k * 0.08);
            });
          }

          /* ===== Scene 1 (0.0–3.2s) — the TUG-OF-WAR =====
             VO "Then:" 0.10 → panels enter from opposite wings, mirrored book-open
             tilts. "as fast as possible" 1.38–2.03 → tap lands LEFT, green commit,
             winner shoves forward, loser tilts away and dims. */

          tl.fromTo(e1, { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
          tl.fromTo(seam, { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.4);

          // split-tilt-cards signature — opposite-wing entry, mirrored rotateY,
          // slight pivot-into-place overshoot on the tilt, ~0.2s stagger
          tl.fromTo(panL, { x: -460, rotationY: 22, opacity: 0 },
            { x: 0, rotationY: 12, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.08);
          tl.fromTo(panR, { x: 460, rotationY: -22, opacity: 0 },
            { x: 0, rotationY: -12, opacity: 1, duration: 0.75, ease: "power3.out" }, 0.28);

          // labels rise in on the entry tail
          tl.fromTo(labL, { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.55);
          tl.fromTo(labR, { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.75);

          // LEFT glyph — zig-zag arrow draws upward ("growing")
          tl.to(zz[0], { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.6);
          tl.to(zz[1], { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, 1.08);

          // RIGHT glyph — three coins drop into a stack (finite, deterministic stagger)
          coins.forEach(function (c, i) {
            var at = 0.9 + i * 0.16;
            tl.fromTo(c, { y: -160, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.34, ease: "power2.in" }, at);
            tl.to(c, { scaleY: 0.85, duration: 0.07, ease: "power1.in" }, at + 0.34);
            tl.to(c, { scaleY: 1, duration: 0.16, ease: "power2.out" }, at + 0.41);
          });

          // the pair presses against the center seam (inner layer, finite yoyo)
          tl.fromTo(pinL, { x: 0 },
            { x: 8, duration: 0.38, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);
          tl.fromTo(pinR, { x: 0 },
            { x: -8, duration: 0.38, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.0);

          // tap lands the LEFT panel on "as fast as possible"
          tapIn(tap1, 1.42);
          tl.to(tap1, { scale: 0.82, duration: 0.09, ease: "power1.in" }, 1.7);
          tl.to(pinL, { scale: 0.965, duration: 0.09, ease: "power1.in" }, 1.7);
          tl.to(tap1, { scale: 1, duration: 0.18, ease: "power2.out" }, 1.79);
          tl.to(pinL, { scale: 1, duration: 0.4, ease: "back.out(1.3)" }, 1.79);
          // commit — winner fills product green
          tl.to(pinL, {
            backgroundColor: "#2BD97C",
            borderColor: "#2BD97C",
            duration: 0.24,
            ease: "power1.out",
          }, 1.79);
          tl.to(labL, { color: "#06231A", duration: 0.24, ease: "power1.out" }, 1.79);
          tl.to(zz, { stroke: "#06231A", duration: 0.24, ease: "power1.out" }, 1.79);
          rippleAt(r1, 1.84);
          tl.to(tap1, { opacity: 0, scale: 0.8, duration: 0.22, ease: "power1.in" }, 2.06);

          // the winner shoves forward, the loser yields — tilts away and dims
          tl.to(panL, { scale: 1.06, rotationY: 5, x: 12,
            duration: 0.5, ease: "power3.out" }, 2.02);
          tl.to(panR, { rotationY: -26, x: 64, scale: 0.94, opacity: 0.45,
            duration: 0.55, ease: "power3.out" }, 2.02);

          /* ===== Scene 2 (3.2–5.6s) — the SHELF =====
             Panels clear upward (within-scene swap); on the second "Then:" (3.12)
             the shelf slides in and three boxes spring-pop up off it (power3, no
             overshoot, stagger capped). "what you already own" 3.40–4.20 → tap
             lands "Nothing yet": lid pops open, box fills green. */

          tl.to(s1, { y: -1250, opacity: 0, duration: 0.55, ease: "power2.in" }, 2.98);

          tl.fromTo(s2, { opacity: 0, x: 110 },
            { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.12);
