<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 5 — Questions 3 + 4: growth vs cash, what you own (buddi-first-1000-grow)
         cursor-ui-demo (two-tap sequence, camera servo). Real Buddi product UI:
         dark ground, top stepper chrome, dark question cards, green selected chips,
         finger-sized tap highlight + ripples, virtual camera servoing between taps,
         answers condensing into left-stacked summary pills.
         Duration 6.549s (synced). Everything the runtime needs lives INSIDE <template>.
         KEEP-OUT: all visible content stays above screen y=1250 at every camera phase. -->
  </head>
  <body>
    <template>
      <style>
        /* ---------- Fonts (variable, shipped with the project) ---------- */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }

        /* ---------- Root (styled via #root, never a class) ---------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* Full-bleed product ground — its own clip layer, never on #root */
        .f5-bg {
          position: absolute;
          inset: 0;
          background: #0B0E11;
        }

        /* Camera stage */
        .f5-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .f5-world {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 2600px;
          transform-origin: 0 0;
          will-change: transform;
        }

        /* ---------- Top stepper chrome (pinned product nav) ---------- */
        .f5-stepper {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        .f5-stepper-inner {
          position: absolute;
          left: 0;
          top: 68px;
          width: 1080px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
        }
        .f5-step {
          display: flex;
          align-items: center;
          gap: 14px;
        }
        .f5-stepcheck {
          display: block;
          width: 44px;
          height: 44px;
        }
        .f5-stepcheck circle {
          fill: #2BD97C;
          stroke: #2BD97C;
          stroke-width: 2;
        }
        .f5-stepcheck path {
          fill: none;
          stroke: #06231A;
          stroke-width: 3.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f5-stepnum {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 1.5px solid #262D33;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-size: 21px;
          font-weight: 500;
          color: #76837C;
        }
        .f5-steplabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 26px;
          font-weight: 500;
          color: #76837C;
          white-space: nowrap;
        }
        .f5-steplabel-on {
          color: #F2F5F4;
        }
        .f5-stepline {
          width: 56px;
          height: 1.5px;
          background: #23292F;
        }

        /* ---------- Question cards (real product card) ---------- */
        .f5-qcard {
          position: absolute;
          left: 119px;
          width: 842px;
          background: #11161A;
          border: 1px solid #262D33;
          border-radius: 16px;
          padding: 40px 44px;
          box-sizing: border-box;
          will-change: transform;
        }
        #f5-q1 { top: 210px; height: 348px; }
        #f5-q2 { top: 860px; height: 450px; }
        .f5-qhead {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 56px;
        }
        .f5-qlabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 40px;
          font-weight: 600;
          letter-spacing: -0.02em;
          color: #F2F5F4;
          line-height: 1.2;
        }
        .f5-qcount {
          background: #171C21;
          border: 1px solid #262D33;
          color: #76837C;
          border-radius: 100px;
          padding: 7px 22px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 22px;
          font-weight: 500;
        }
        .f5-chips {
          margin-top: 26px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .f5-chip {
          height: 84px;
          display: flex;
          align-items: center;
          padding: 0 36px;
          box-sizing: border-box;
          background: #15191D;
          border: 1px solid #2A2F34;
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 30px;
          font-weight: 600;
          color: #F2F5F4;
          will-change: transform;
        }

        /* ---------- Tap actor (finger-sized highlight, no arrow cursor) ---------- */
        .f5-tap {
          position: absolute;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: rgba(43, 217, 124, 0.26);
          border: 1.5px solid rgba(43, 217, 124, 0.4);
          opacity: 0;
          pointer-events: none;
          z-index: 5;
          will-change: transform;
        }
        .f5-ripple {
          position: absolute;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          border: 2.5px solid rgba(43, 217, 124, 0.8);
          opacity: 0;
          pointer-events: none;
          z-index: 4;
          will-change: transform;
        }
        /* tap/ripple anchors — centered on each tapped chip
           chip 0 center inside card: y = 164, x = 380 */
        #f5-tap1 { left: 332px; top: 116px; }
        .f5-r1   { left: 325px; top: 109px; }
        #f5-tap2 { left: 332px; top: 116px; }
        .f5-r2   { left: 325px; top: 109px; }

        /* ---------- Summary stack (Scene 3 resolve — stacking left) ---------- */
        .f5-sumhead {
          position: absolute;
          left: 119px;
          top: 1440px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 27px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #76837C;
        }
        .f5-sumpill {
          position: absolute;
          left: 119px;
          height: 108px;
          display: flex;
          align-items: center;
          gap: 26px;
          padding: 0 44px 0 36px;
          box-sizing: border-box;
          background: #11161A;
          border: 1px solid rgba(43, 217, 124, 0.35);
          border-radius: 100px;
          will-change: transform;
        }
        #f5-sum1 { top: 1510px; }
        #f5-sum2 { top: 1648px; }
        .f5-check {
          display: block;
          width: 48px;
          height: 48px;
          flex: none;
        }
        .f5-check path {
          fill: none;
          stroke: #2BD97C;
          stroke-width: 4.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f5-sumlabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 32px;
          font-weight: 500;
          color: #F2F5F4;
          white-space: nowrap;
        }
      </style>

      <div id="root" data-composition-id="05-questions-growth-own" data-width="1080" data-height="1920">
        <!-- full-bleed ground as a clip layer -->
        <div class="clip f5-bg" data-start="0" data-duration="6.549" data-track-index="0"></div>

        <div class="clip f5-stage" data-start="0" data-duration="6.549" data-track-index="1">
          <div class="f5-world" id="f5-world">
            <!-- Scene 1: question 3 — the goal -->
            <div class="f5-qcard" id="f5-q1">
              <div class="f5-qhead">
                <div class="f5-qlabel">What&rsquo;s the goal for it?</div>
                <div class="f5-qcount">3 of 5</div>
              </div>
              <div class="f5-chips">
                <div class="f5-chip" id="f5-q1c1">Grow as fast as possible</div>
                <div class="f5-chip" id="f5-q1c2">Pay me steady cash</div>
              </div>
              <div class="f5-ripple f5-r1" id="f5-r1a"></div>
              <div class="f5-ripple f5-r1" id="f5-r1b"></div>
              <div class="f5-tap" id="f5-tap1"></div>
            </div>

            <!-- Scene 2: question 4 — what you already own -->
            <div class="f5-qcard" id="f5-q2">
              <div class="f5-qhead">
                <div class="f5-qlabel">What do you already own?</div>
                <div class="f5-qcount">4 of 5</div>
              </div>
              <div class="f5-chips">
                <div class="f5-chip" id="f5-q2c1">Nothing yet</div>
                <div class="f5-chip" id="f5-q2c2">Some stocks</div>
                <div class="f5-chip" id="f5-q2c3">A retirement fund</div>
              </div>
              <div class="f5-ripple f5-r2" id="f5-r2a"></div>
              <div class="f5-ripple f5-r2" id="f5-r2b"></div>
              <div class="f5-tap" id="f5-tap2"></div>
            </div>

            <!-- Scene 3: answers condense into compact summary pills, stacking left -->
            <div class="f5-sumhead" id="f5-sumhead">4 of 5 answered</div>
            <div class="f5-sumpill" id="f5-sum1">
              <svg class="f5-check" viewBox="0 0 52 52"><path class="f5-checkpath" d="M13 27 L22 36 L39 17" /></svg>
              <span class="f5-sumlabel">Grow as fast as possible</span>
            </div>
            <div class="f5-sumpill" id="f5-sum2">
              <svg class="f5-check" viewBox="0 0 52 52"><path class="f5-checkpath" d="M13 27 L22 36 L39 17" /></svg>
              <span class="f5-sumlabel">Nothing yet</span>
            </div>
          </div>
        </div>

        <!-- Top stepper chrome — pinned above the camera world -->
        <div class="clip f5-stepper" data-start="0" data-duration="6.549" data-track-index="2">
          <div class="f5-stepper-inner" id="f5-stepper-inner">
            <div class="f5-step">
              <svg class="f5-stepcheck" viewBox="0 0 44 44">
                <circle cx="22" cy="22" r="20.5" />
                <path d="M14 22.5 L20 28.5 L31 16.5" />
              </svg>
              <span class="f5-steplabel f5-steplabel-on">Find stocks</span>
            </div>
            <div class="f5-stepline"></div>
            <div class="f5-step">
              <div class="f5-stepnum">2</div>
              <span class="f5-steplabel">Build the strategy</span>
            </div>
            <div class="f5-stepline"></div>
            <div class="f5-step">
              <div class="f5-stepnum">3</div>
              <span class="f5-steplabel">Test live</span>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var root = document.querySelector('[data-composition-id="05-questions-growth-own"]');
          var $ = function (id) { return document.getElementById(id); };

          var world = $("f5-world");
          var stepperInner = $("f5-stepper-inner");
          var q1 = $("f5-q1"), q2 = $("f5-q2");
          var chips = [$("f5-q1c1"), $("f5-q2c1")];
          var dims = [[$("f5-q1c2")], [$("f5-q2c2"), $("f5-q2c3")]];
          var taps = [$("f5-tap1"), $("f5-tap2")];
          var ripples = [
            [$("f5-r1a"), $("f5-r1b")],
            [$("f5-r2a"), $("f5-r2b")],
          ];
          var sumhead = $("f5-sumhead");
          var sumpills = [$("f5-sum1"), $("f5-sum2")];
          var checkPaths = root.querySelectorAll(".f5-checkpath");

          // svg-path-draw setup — measure each summary check, park it undrawn
          checkPaths.forEach(function (p) {
            var len = p.getTotalLength();
            p.style.strokeDasharray = String(len);
            p.style.strokeDashoffset = String(len);
          });

          // --- virtual camera (viewport-change, single-wrapper composite) ---
          // transform-origin is 0 0, so screen = S * world + cam offset.
          var cam = { s: 1, x: 0, y: 0 };
          function applyCamera() {
            world.style.transform =
              "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.s + ")";
          }
          applyCamera();

          var tl = gsap.timeline({ paused: true });

          // shared helpers
          function enterCard(card, at) {
            tl.fromTo(card, { opacity: 0, y: 90, scale: 0.98 },
              { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, at);
          }
          // cursor-click-ripple (thumb-tap variant) + press-release-spring
          function tap(i, at) {
            var dot = taps[i], chip = chips[i], rings = ripples[i];
            // finger-sized tap-highlight lands (fade-grow instead of a mouse travel)
            tl.fromTo(dot, { opacity: 0, scale: 0.5 },
              { opacity: 1, scale: 1, duration: 0.28, ease: "power2.out" }, at);
            // press — linear compression (tap dot + chip compress together)
            tl.to(dot, { scale: 0.82, duration: 0.09, ease: "power1.in" }, at + 0.32);
            tl.to(chip, { scale: 0.955, duration: 0.09, ease: "power1.in" }, at + 0.32);
            // release — micro spring recovery (state-continuous with the press)
            tl.to(dot, { scale: 1, duration: 0.2, ease: "power2.out" }, at + 0.41);
            tl.to(chip, { scale: 1, duration: 0.42, ease: "back.out(1.3)" }, at + 0.41);
            // chip commits — fills solid product green, near-black text
            tl.to(chip, {
              backgroundColor: "#2BD97C",
              color: "#06231A",
              borderColor: "#2BD97C",
              duration: 0.22,
              ease: "power1.out",
            }, at + 0.41);
            // ripple rings radiate from the tap point (hold CSS-hidden until now)
            rings.forEach(function (r, k) {
              tl.fromTo(r, { scale: 0.35, opacity: 0.75 },
                { scale: 2.5, opacity: 0, duration: 0.55, ease: "power2.out",
                  immediateRender: false }, at + 0.38 + k * 0.08);
            });
            // tap-highlight lifts off
            tl.to(dot, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power1.in" }, at + 0.62);
            // unselected chips recede — the choice reads at a glance
            tl.to(dims[i], { opacity: 0.55, duration: 0.3, ease: "power1.out" }, at + 0.55);
          }

          /* ===== Scene 1 (0.00–2.99s) — Q3 "What's the goal for it?" =====
             VO: "Then:" 0.10 → card enters; "growing as fast as possible"
             0.97–2.03 → tap lands "Grow as fast as possible". */

          // stepper chrome settles in quietly at the top (step 1 already checked)
          tl.fromTo(stepperInner, { opacity: 0, y: -18 },
            { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);

          // hero card arrives on the first "Then:" (visible well before t=0.5)
          enterCard(q1, 0.05);

          // tap lands during "as fast as possible" — green fill commits ~1.67
          tap(0, 0.95);

          /* ===== Scene 2 (2.99–5.24s) — camera servos down to Q4 =====
             VO: second "Then:" 3.12 → servo + card 2; "what you already own"
             3.40–4.20 → tap lands "Nothing yet". */

          // camera servos down (viewport-change: cam pans down → world translates up)
          tl.to(cam, { y: -500, duration: 0.75, ease: "power2.inOut", onUpdate: applyCamera }, 2.85);
          enterCard(q2, 3.25);
          tap(1, 3.95);

          /* ===== Scene 3 (5.24–6.549s) — "more of the same" 5.31–6.12: =====
             answered chips condense into compact green summary pills stacking left. */

          // answered cards condense away (within-scene swap, not an exit)
          tl.to([q1, q2], { opacity: 0, scale: 0.94, duration: 0.45, ease: "power2.in" }, 5.15);

          // camera settles slightly wider on the summary
          // (S=0.95; x centers 1080-wide world: (1080-1080*0.95)/2 = 27; y = 280 - 0.95*1440)
          tl.to(cam, { s: 0.95, x: 27, y: -1088, duration: 0.9, ease: "power3.inOut",
            onUpdate: applyCamera }, 5.15);

          // muted eyebrow
          tl.fromTo(sumhead, { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.45);

          // answered chips re-land as compact pills, stacking left (smooth power3 settle)
          sumpills.forEach(function (p, i) {
            tl.fromTo(p, { opacity: 0, scale: 0.86, y: 22 },
              { opacity: 1, scale: 1, y: 0, duration: 0.55, ease: "power3.out" },
              5.6 + i * 0.18);
          });

          // svg-path-draw — green check marks trace on, staggered
          checkPaths.forEach(function (p, i) {
            tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" },
              5.92 + i * 0.16);
          });
          // then: still settle to 6.549 — no exit (root transition owns it)

          window.__timelines["05-questions-growth-own"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
