<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 4 — Question 2: your real risk tolerance (buddi-first-1000-grow)
         cursor-ui-demo (Adapt — single-question tap, held resolve).
         Real Buddi product UI: dark ground, top stepper chrome, dark question card,
         green selected chip, tap-highlight actor. The point of the frame is the
         extra-beat HOLD after the tag lands — dead still from ~3.66s to 5.483s.
         Everything the runtime needs lives INSIDE <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ---------- Fonts (variable, shipped with the project) ---------- */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }

        /* ---------- Root (styled via #root, never a class) ---------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* Full-bleed product ground — its own clip layer, never on #root */
        .f4-bg {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(900px 620px at 540px 620px, rgba(43, 217, 124, 0.05), rgba(43, 217, 124, 0) 70%),
            #0B0E11;
        }

        /* Static content stage — camera stays put (single-question tap) */
        .f4-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* ---------- Top stepper chrome (product nav, step 1 done) ---------- */
        .f4-stepper {
          position: absolute;
          left: 0;
          top: 68px;
          width: 1080px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
          will-change: transform;
        }
        .f4-step {
          display: flex;
          align-items: center;
          gap: 14px;
        }
        .f4-stepcheck {
          display: block;
          width: 44px;
          height: 44px;
        }
        .f4-stepcheck circle {
          fill: #2BD97C;
          stroke: #2BD97C;
          stroke-width: 2;
        }
        .f4-stepcheck path {
          fill: none;
          stroke: #06231A;
          stroke-width: 3.5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f4-stepnum {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          border: 1.5px solid #262D33;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Space Grotesk", sans-serif;
          font-size: 21px;
          font-weight: 500;
          color: #76837C;
        }
        .f4-steplabel {
          font-family: "Space Grotesk", sans-serif;
          font-size: 26px;
          font-weight: 500;
          color: #76837C;
          white-space: nowrap;
        }
        .f4-steplabel-on {
          color: #F2F5F4;
        }
        .f4-stepline {
          width: 56px;
          height: 1.5px;
          background: #23292F;
        }

        /* ---------- The risk question card (real product card) ---------- */
        .f4-qcard {
          position: absolute;
          left: 119px;
          top: 400px;
          width: 842px;
          height: 604px;
          background: #11161A;
          border: 1px solid #262D33;
          border-radius: 16px;
          padding: 44px;
          box-sizing: border-box;
          will-change: transform;
        }
        .f4-qcount {
          display: inline-flex;
          align-items: center;
          height: 42px;
          background: #171C21;
          border: 1px solid #262D33;
          color: #76837C;
          border-radius: 100px;
          padding: 0 24px;
          box-sizing: border-box;
          font-family: "Space Grotesk", sans-serif;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.04em;
        }
        .f4-scenario {
          margin-top: 26px;
          font-size: 33px;
          font-weight: 400;
          line-height: 1.35;
          color: #A8B3AE;
        }
        .f4-question {
          margin-top: 10px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 52px;
          font-weight: 600;
          letter-spacing: -0.02em;
          line-height: 1.2;
          color: #F2F5F4;
        }
        .f4-chips {
          margin-top: 32px;
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        .f4-chip {
          height: 88px;
          display: flex;
          align-items: center;
          padding: 0 36px;
          box-sizing: border-box;
          background: #15191D;
          border: 1px solid #2A2F34;
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 31px;
          font-weight: 600;
          color: #F2F5F4;
          will-change: transform;
        }

        /* ---------- Tap actor (finger-sized highlight, no arrow cursor) ----------
           "Hold on" chip center, card-local: x 300, y 410 */
        .f4-tap {
          position: absolute;
          left: 252px;
          top: 362px;
          width: 96px;
          height: 96px;
          border-radius: 50%;
          background: rgba(43, 217, 124, 0.26);
          border: 1.5px solid rgba(43, 217, 124, 0.4);
          opacity: 0;
          pointer-events: none;
          z-index: 5;
          will-change: transform;
        }
        .f4-ripple {
          position: absolute;
          left: 245px;
          top: 355px;
          width: 110px;
          height: 110px;
          border-radius: 50%;
          border: 2.5px solid rgba(43, 217, 124, 0.8);
          opacity: 0;
          pointer-events: none;
          z-index: 4;
          will-change: transform;
        }

        /* ---------- "your real one" tag + inline-SVG eyes (NO emoji font) ---------- */
        .f4-tag {
          position: absolute;
          right: 130px;
          top: 1044px;
          display: inline-flex;
          align-items: center;
          gap: 18px;
          height: 76px;
          padding: 0 34px;
          box-sizing: border-box;
          background: rgba(43, 217, 124, 0.16);
          border: 1.5px solid rgba(43, 217, 124, 0.32);
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 34px;
          font-weight: 600;
          letter-spacing: -0.01em;
          color: #2BD97C;
          will-change: transform;
        }
        .f4-eyes {
          display: block;
          width: 52px;
          height: 26px;
          flex: none;
        }
        .f4-eyes circle.f4-eye {
          fill: none;
          stroke: #A8B3AE;
          stroke-width: 2.5;
        }
        .f4-eyes circle.f4-pupil {
          fill: #A8B3AE;
        }
      </style>

      <div id="root" data-composition-id="04-question-risk" data-width="1080" data-height="1920">
        <!-- full-bleed ground as a clip layer -->
        <div class="clip f4-bg" data-start="0" data-duration="5.483" data-track-index="0"></div>

        <div class="clip f4-stage" data-start="0" data-duration="5.483" data-track-index="1">
          <!-- Top stepper chrome — carried over: "Find stocks" already checked -->
          <div class="f4-stepper" id="f4-stepper">
            <div class="f4-step">
              <svg class="f4-stepcheck" viewBox="0 0 44 44">
                <circle cx="22" cy="22" r="20.5" />
                <path d="M14 22.5 L20 28.5 L31 16.5" />
              </svg>
              <span class="f4-steplabel f4-steplabel-on">Find stocks</span>
            </div>
            <div class="f4-stepline"></div>
            <div class="f4-step">
              <div class="f4-stepnum">2</div>
              <span class="f4-steplabel">Build the strategy</span>
            </div>
            <div class="f4-stepline"></div>
            <div class="f4-step">
              <div class="f4-stepnum">3</div>
              <span class="f4-steplabel">Test live</span>
            </div>
          </div>

          <!-- Scene 1: the risk question card slides up; chips stagger on -->
          <div class="f4-qcard" id="f4-qcard">
            <div class="f4-qcount">Question 2</div>
            <div class="f4-scenario" id="f4-scenario">A rough month hits and it drops hard.</div>
            <div class="f4-question" id="f4-question">What do you do?</div>
            <div class="f4-chips">
              <div class="f4-chip" id="f4-chip-sell">Sell it</div>
              <div class="f4-chip" id="f4-chip-hold">Hold on</div>
              <div class="f4-chip" id="f4-chip-buy">Buy more</div>
            </div>
            <!-- Scene 2: tap-highlight hovers… then lands "Hold on" -->
            <div class="f4-ripple" id="f4-ripple-a"></div>
            <div class="f4-ripple" id="f4-ripple-b"></div>
            <div class="f4-tap" id="f4-tap"></div>
          </div>

          <!-- Scene 2 payoff: "your real one" tag + muted inline-SVG eyes -->
          <div class="f4-tag" id="f4-tag">
            <span>your real one</span>
            <svg class="f4-eyes" viewBox="0 0 52 26">
              <circle class="f4-eye" cx="13" cy="13" r="10.5" />
              <circle class="f4-eye" cx="39" cy="13" r="10.5" />
              <circle class="f4-pupil" cx="15.5" cy="14.5" r="4.2" />
              <circle class="f4-pupil" cx="41.5" cy="14.5" r="4.2" />
            </svg>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var $ = function (id) { return document.getElementById(id); };
          var stepper = $("f4-stepper");
          var qcard = $("f4-qcard");
          var chips = [$("f4-chip-sell"), $("f4-chip-hold"), $("f4-chip-buy")];
          var holdChip = $("f4-chip-hold");
          var tap = $("f4-tap");
          var ripples = [$("f4-ripple-a"), $("f4-ripple-b")];
          var tag = $("f4-tag");

          var tl = gsap.timeline({ paused: true });

          /* ============ Scene 1 (0.0–2.2s) — the risk card, nothing else ============
             VO 0.10–2.52: "Then: how you'd actually feel watching it drop hard
             in a rough month" */

          // stepper chrome settles quietly at the top
          tl.fromTo(stepper, { opacity: 0, y: -16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);

          // hero card slides up on "Then:" — visible well before t=0.5
          tl.fromTo(qcard, { opacity: 0, y: 90, scale: 0.98 },
            { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.1);

          // chips stagger on as the VO describes the feeling (0.53–1.2s)
          chips.forEach(function (c, i) {
            tl.fromTo(c, { opacity: 0, y: 26 },
              { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.5 + i * 0.18);
          });

          // "drop hard" (1.61s) — the card itself takes a tiny hit and recovers
          tl.to(qcard, { y: 9, duration: 0.16, ease: "power2.in" }, 1.61);
          tl.to(qcard, { y: 0, duration: 0.45, ease: "power3.out" }, 1.77);

          /* ============ Scene 2 (2.2–3.66s) — the tap hovers… lands "Hold on" ============
             VO 2.69–3.77: "that's your real risk tolerance," */

          // tap-highlight fades in OFF-target, hovering (the hesitation is the beat)
          tl.fromTo(tap, { opacity: 0, scale: 0.9, x: -30, y: -104 },
            { opacity: 1, scale: 1, x: -18, y: -72, duration: 0.32, ease: "power2.out" }, 2.22);

          // …then commits — drifts onto the chip center
          tl.to(tap, { x: 0, y: 0, duration: 0.34, ease: "power2.inOut" }, 2.6);

          // press — linear compression, tap dot + chip compress together (2.85s ≈ "your real")
          tl.to(tap, { scale: 0.82, duration: 0.09, ease: "power1.in" }, 2.85);
          tl.to(holdChip, { scale: 0.955, duration: 0.09, ease: "power1.in" }, 2.85);

          // release — micro spring recovery, state-continuous with the press
          tl.to(tap, { scale: 1, duration: 0.2, ease: "power2.out" }, 2.94);
          tl.to(holdChip, { scale: 1, duration: 0.42, ease: "back.out(1.3)" }, 2.94);

          // chip commits — fills solid product green, near-black text
          tl.to(holdChip, {
            backgroundColor: "#2BD97C",
            color: "#06231A",
            borderColor: "#2BD97C",
            duration: 0.22,
            ease: "power1.out",
          }, 2.94);

          // ripple rings radiate from the tap point (held invisible until now)
          ripples.forEach(function (r, k) {
            tl.fromTo(r, { scale: 0.35, opacity: 0.75 },
              { scale: 2.4, opacity: 0, duration: 0.55, ease: "power2.out",
                immediateRender: false }, 2.9 + k * 0.08);
          });

          // tap-highlight lifts off
          tl.to(tap, { opacity: 0, scale: 0.8, duration: 0.25, ease: "power1.in" }, 3.18);

          // "your real risk tolerance" (3.15s) — the tag spring-pops in beside the card
          // (the frame's one sanctioned spring-pop)
          tl.fromTo(tag, { opacity: 0, scale: 0.6, y: 24, rotation: -2.5 },
            { opacity: 1, scale: 1, y: 0, rotation: -2.5, duration: 0.55,
              ease: "back.out(1.6)" }, 3.15);

          /* ============ Scene 3 (3.66–5.483s) — the HOLD ============
             VO 3.77–5.05: "not the brave one in your head."
             Everything has landed by ~3.7s. DEAD STILL to the end — the extra
             beat of stillness is the frame's point. No tweens past this line. */

          window.__timelines["04-question-risk"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
