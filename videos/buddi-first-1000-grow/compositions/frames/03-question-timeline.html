<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- Frame 3 — "the question is a journey" (buddi-first-1000-grow) — REBUILD
         Scene 1 (0.0–1.4s): question lands as clean type upper-third ("When will you
           need this money?" near-white h3, "QUESTION 1" green eyebrow); a long gently
           undulating green path draws left→right (svg-path-draw) with three milestone
           nodes popping along it: "Under a year" / "A few years" / "5+ years".
         Scene 2 (1.4–3.3s): on "how soon you'll need the money," a glowing green dot
           departs the path start and TRAVELS along it (transform along path points
           sampled deterministically from the drawn path — one onUpdate master tween,
           small motion trail), passing "Under a year" and settling ON "A few years":
           that chip fills solid green (near-black text) and pulses once. A small clock
           beside the question has LIVE spinning hands during the travel window only
           (svg-icon-enrichment — SVG transform attribute rotation, stops on landing).
         Scene 3 (3.3–4.715s): on "plays it safer," a green shield glyph draws itself
           (svg-path-draw) beneath the landed milestone with the muted tag
           "sooner = safer"; dead-still hold.
         Duration EXACTLY 4.715s. Content above y≈1250. No exits, no repeats, no
           randomness — one paused timeline at window.__timelines["03-question-timeline"].
         Everything the runtime needs lives INSIDE <template>. -->
  </head>
  <body>
    <template>
      <style>
        /* ---------- Fonts (variable, shipped with the project) ---------- */
        @font-face {
          font-family: "Space Grotesk";
          src: url("assets/fonts/space-grotesk-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }
        @font-face {
          font-family: "Inter";
          src: url("assets/fonts/inter-var.woff2") format("woff2-variations");
          font-weight: 300 800;
          font-style: normal;
          font-display: block;
        }

        /* ---------- Root (styled via #root, never a class) ---------- */
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Inter", sans-serif;
        }

        /* Full-bleed ground — its own clip layer, never on #root */
        .f3jt-bg {
          position: absolute;
          inset: 0;
          background: #0B0E11;
        }

        .f3jt-stage {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }

        /* ---------- Scene 1 — the question as clean type, upper third ---------- */
        .f3jt-eyebrow {
          position: absolute;
          left: 84px;
          top: 300px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #2BD97C;
          opacity: 0;
        }
        .f3jt-question {
          position: absolute;
          left: 84px;
          top: 352px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 48px;
          font-weight: 500;
          letter-spacing: -0.02em;
          line-height: 1.25;
          color: #F2F5F4;
          white-space: nowrap;
          opacity: 0;
        }

        /* clock icon beside the question — hands rotate during the travel window */
        .f3jt-clock {
          position: absolute;
          left: 918px;
          top: 322px;
          width: 76px;
          height: 76px;
          opacity: 0;
        }

        /* ---------- The journey path (SVG, viewBox units == canvas px) ---------- */
        .f3jt-pathsvg {
          position: absolute;
          left: 0;
          top: 620px; /* PATH_TOP — mirrored as a JS constant */
          width: 1080px;
          height: 360px;
          overflow: visible;
        }
        .f3jt-pathsvg .f3jt-line {
          fill: none;
          stroke: rgba(43, 217, 124, 0.4); /* faint green */
          stroke-width: 5;
          stroke-linecap: round;
          stroke-linejoin: round;
        }

        /* milestone nodes — small green dots riding the path (positioned by JS) */
        .f3jt-node {
          position: absolute;
          width: 26px;
          height: 26px;
          border-radius: 50%;
          background: #10151A;
          border: 3px solid #2BD97C;
          box-sizing: border-box;
        }

        /* milestone chips — dark pills hanging just under their node (JS-placed) */
        .f3jt-chip {
          position: absolute;
          height: 64px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-sizing: border-box;
          background: #12181C;
          border: 1px solid #2A3238;
          border-radius: 100px;
          font-family: "Space Grotesk", sans-serif;
          font-size: 28px;
          font-weight: 600;
          color: #F2F5F4;
          white-space: nowrap;
          opacity: 0;
          will-change: transform;
        }

        /* ---------- Scene 2 — the traveling dot + motion trail ---------- */
        /* wrappers are moved ONLY by the onUpdate transform write (never gsap-tweened) */
        .f3jt-dotwrap {
          position: absolute;
          left: 0;
          top: 0;
          width: 30px;
          height: 30px;
          margin-left: -15px;
          margin-top: -15px;
          pointer-events: none;
          z-index: 6;
        }
        .f3jt-dotinner {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: #2BD97C;
          box-shadow: 0 0 26px 7px rgba(43, 217, 124, 0.55);
          opacity: 0;
        }
        .f3jt-trailgroup {
          position: absolute;
          inset: 0;
          opacity: 0;
          pointer-events: none;
          z-index: 5;
        }
        .f3jt-trail {
          position: absolute;
          left: 0;
          top: 0;
          border-radius: 50%;
          background: #2BD97C;
        }
        .f3jt-trail-1 { width: 18px; height: 18px; margin: -9px 0 0 -9px; opacity: 0.38; }
        .f3jt-trail-2 { width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; opacity: 0.22; }
        .f3jt-trail-3 { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; opacity: 0.12; }

        /* landing flare ring (JS-placed on the landing point, CSS-hidden until fired) */
        .f3jt-flare {
          position: absolute;
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: 3px solid rgba(43, 217, 124, 0.8);
          opacity: 0;
          pointer-events: none;
          z-index: 4;
          will-change: transform;
        }

        /* ---------- Scene 3 — shield draws itself + muted tag (JS-placed) ---------- */
        .f3jt-shieldrow {
          position: absolute;
          width: 300px;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 16px;
        }
        .f3jt-shield {
          width: 56px;
          height: 56px;
          flex: none;
        }
        .f3jt-shield path {
          fill: none;
          stroke: #2BD97C;
          stroke-width: 4;
          stroke-linecap: round;
          stroke-linejoin: round;
        }
        .f3jt-tag {
          font-family: "Space Grotesk", sans-serif;
          font-size: 30px;
          font-weight: 500;
          letter-spacing: 0.02em;
          color: #A8B3AE;
          white-space: nowrap;
          opacity: 0;
        }
      </style>

      <div id="root" data-composition-id="03-question-timeline" data-width="1080" data-height="1920">
        <!-- full-bleed ground as a clip layer (never on #root) -->
        <div class="clip f3jt-bg" data-start="0" data-duration="4.715" data-track-index="0"></div>

        <div class="clip f3jt-stage" data-start="0" data-duration="4.715" data-track-index="1">
          <!-- Scene 1: the question lands as clean type -->
          <div class="f3jt-eyebrow" id="f3jt-eyebrow">Question 1</div>
          <div class="f3jt-question" id="f3jt-question">When will you need this money?</div>

          <!-- clock beside the question — hands enriched during the travel window -->
          <svg class="f3jt-clock" id="f3jt-clock" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(43,217,124,0.45)" stroke-width="6" />
            <line id="f3jt-hand-min" x1="60" y1="60" x2="60" y2="26"
              stroke="#F2F5F4" stroke-width="6" stroke-linecap="round" />
            <line id="f3jt-hand-sec" x1="60" y1="60" x2="60" y2="34"
              stroke="#2BD97C" stroke-width="3.5" stroke-linecap="round" />
            <circle cx="60" cy="60" r="6" fill="#F2F5F4" />
          </svg>

          <!-- the journey path — draws left→right, undulating, faint green -->
          <svg class="f3jt-pathsvg" viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg">
            <path class="f3jt-line" id="f3jt-path"
              d="M 70 190 C 200 118, 330 252, 470 192 C 590 140, 680 246, 810 198 C 892 168, 962 212, 1012 184" />
          </svg>

          <!-- milestone nodes + chips (positions computed from the path at load) -->
          <div class="f3jt-node" id="f3jt-node1"></div>
          <div class="f3jt-node" id="f3jt-node2"></div>
          <div class="f3jt-node" id="f3jt-node3"></div>
          <div class="f3jt-chip" id="f3jt-chip1">Under a year</div>
          <div class="f3jt-chip" id="f3jt-chip2">A few years</div>
          <div class="f3jt-chip" id="f3jt-chip3">5+ years</div>

          <!-- Scene 2: traveling dot, motion trail, landing flare -->
          <div class="f3jt-trailgroup" id="f3jt-trailgroup">
            <div class="f3jt-dotwrap" id="f3jt-trail1"><div class="f3jt-trail f3jt-trail-1"></div></div>
            <div class="f3jt-dotwrap" id="f3jt-trail2"><div class="f3jt-trail f3jt-trail-2"></div></div>
            <div class="f3jt-dotwrap" id="f3jt-trail3"><div class="f3jt-trail f3jt-trail-3"></div></div>
          </div>
          <div class="f3jt-dotwrap" id="f3jt-dotwrap">
            <div class="f3jt-dotinner" id="f3jt-dotinner"></div>
          </div>
          <div class="f3jt-flare" id="f3jt-flare"></div>

          <!-- Scene 3: shield draws itself + muted tag, under the landed milestone -->
          <div class="f3jt-shieldrow" id="f3jt-shieldrow">
            <svg class="f3jt-shield" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <path id="f3jt-shield-outline"
                d="M 32 6 L 54 15 L 54 31 C 54 45 45 55 32 60 C 19 55 10 45 10 31 L 10 15 Z" />
              <path id="f3jt-shield-check" d="M 22 32 L 29 39 L 42 25" />
            </svg>
            <span class="f3jt-tag" id="f3jt-tag">sooner = safer</span>
          </div>
        </div>
      </div>

      <script src="assets/vendor/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          var $ = function (id) { return document.getElementById(id); };

          /* ---------- deterministic geometry from the drawn path ---------- */
          var PATH_TOP = 620; // must mirror .f3jt-pathsvg top
          var path = $("f3jt-path");
          var L = path.getTotalLength();
          // svg-path-draw: one dash the length of the whole path, offset fully out
          path.style.strokeDasharray = String(L);
          path.style.strokeDashoffset = String(L);

          // milestone fractions along the path: under-a-year / a-few-years / 5+-years
          var FR = [0.18, 0.52, 0.86];
          var CHIP_W = [252, 240, 188]; // fixed widths — no font-dependent measuring
          var pts = FR.map(function (f) { return path.getPointAtLength(L * f); });

          ["f3jt-node1", "f3jt-node2", "f3jt-node3"].forEach(function (id, i) {
            var n = $(id);
            n.style.left = (pts[i].x - 13) + "px";
            n.style.top = (PATH_TOP + pts[i].y - 13) + "px";
          });
          ["f3jt-chip1", "f3jt-chip2", "f3jt-chip3"].forEach(function (id, i) {
            var c = $(id);
            c.style.width = CHIP_W[i] + "px";
            c.style.left = (pts[i].x - CHIP_W[i] / 2) + "px";
            c.style.top = (PATH_TOP + pts[i].y + 40) + "px";
          });

          var land = pts[1]; // the dot settles on "A few years"
          var flare = $("f3jt-flare");
          flare.style.left = (land.x - 45) + "px";
          flare.style.top = (PATH_TOP + land.y - 45) + "px";

          var srow = $("f3jt-shieldrow");
          srow.style.left = (land.x - 150) + "px";
          srow.style.top = (PATH_TOP + land.y + 140) + "px"; // under the landed chip

          // shield glyph dash prep (svg-path-draw, per-segment measured lengths)
          ["f3jt-shield-outline", "f3jt-shield-check"].forEach(function (id) {
            var p = $(id);
            var l = p.getTotalLength();
            p.style.strokeDasharray = String(l);
            p.style.strokeDashoffset = String(l);
          });

          /* ---------- travel machinery (transform written ONLY by onUpdate) ---------- */
          var dotWrap = $("f3jt-dotwrap");
          var trailWraps = [$("f3jt-trail1"), $("f3jt-trail2"), $("f3jt-trail3")];
          var TARGET = FR[1]; // travel covers path start → the middle milestone
          function placeAt(el, p) {
            var pt = path.getPointAtLength(L * TARGET * p);
            el.style.transform = "translate(" + pt.x + "px," + (PATH_TOP + pt.y) + "px)";
          }
          placeAt(dotWrap, 0);
          trailWraps.forEach(function (w) { placeAt(w, 0); });

          var hMin = $("f3jt-hand-min");
          var hSec = $("f3jt-hand-sec");

          var tl = gsap.timeline({ paused: true });

          /* ===== Scene 1 (0.0–1.4s) — the question lands, the journey draws =====
             VO: "Then it just asks you a few simple things." (0.10–1.53) */

          tl.fromTo("#f3jt-eyebrow", { opacity: 0, y: -14 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);

          // hero type — visible well before t=0.5
          tl.fromTo("#f3jt-question", { opacity: 0, y: 26 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.12);

          tl.fromTo("#f3jt-clock", { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0.3);

          // svg-path-draw — the long undulating path traces left→right, pen-steady
          var DRAW_START = 0.35, DRAW_DUR = 0.8;
          tl.to(path, { strokeDashoffset: 0, duration: DRAW_DUR, ease: "none" }, DRAW_START);

          // milestone nodes pop exactly as the draw front reaches them (linear draw
          // → node k appears at DRAW_START + DRAW_DUR * FR[k]); chip follows a beat later
          FR.forEach(function (f, i) {
            var at = DRAW_START + DRAW_DUR * f;
            tl.fromTo("#f3jt-node" + (i + 1), { scale: 0, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.7)" }, at);
            tl.fromTo("#f3jt-chip" + (i + 1), { opacity: 0, y: 14 },
              { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, at + 0.08);
          });

          /* ===== Scene 2 (1.4–3.3s) — the glowing dot travels the path =====
             VO: "First: how soon you'll need the money" (1.76–3.02) */

          // dot ignites at the path start on "First:"
          tl.fromTo("#f3jt-dotinner", { opacity: 0, scale: 0.3 },
            { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.7);

          // master travel tween — dot + trail ghosts + clock hands share one
          // deterministic onUpdate; the hands spin ONLY while the dot travels
          // and stop the instant it lands (svg-icon-enrichment, SVG attr rotation)
          var travel = { p: 0 };
          tl.to(travel, {
            p: 1,
            duration: 1.0,
            ease: "power2.inOut",
            onUpdate: function () {
              placeAt(dotWrap, travel.p);
              for (var k = 0; k < 3; k++) {
                placeAt(trailWraps[k], Math.max(0, travel.p - 0.055 * (k + 1)));
              }
              hMin.setAttribute("transform", "rotate(" + (330 * travel.p) + " 60 60)");
              hSec.setAttribute("transform", "rotate(" + (1250 * travel.p) + " 60 60)");
            },
          }, 2.0);

          // motion trail breathes in while moving, gone before the landing
          tl.fromTo("#f3jt-trailgroup", { opacity: 0 },
            { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.05);
          tl.to("#f3jt-trailgroup", { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.8);

          // the dot passes "Under a year" (~p where eased progress hits FR ratio) — nudge
          tl.to("#f3jt-node1", { scale: 1.14, duration: 0.12, ease: "power2.out" }, 2.4);
          tl.to("#f3jt-node1", { scale: 1, duration: 0.2, ease: "power2.inOut" }, 2.52);

          // ---- landing on "A few years" at t=3.0 ----
          // chip commits: fills solid product green, near-black text
          tl.to("#f3jt-chip2", {
            backgroundColor: "#2BD97C",
            color: "#06231A",
            borderColor: "#2BD97C",
            duration: 0.22,
            ease: "power1.out",
          }, 3.0);

          // node flares up and holds slightly enlarged (the dot merges into it)
          tl.to("#f3jt-node2", { scale: 1.5, duration: 0.15, ease: "power2.out" }, 3.0);
          tl.to("#f3jt-node2", { scale: 1.2, duration: 0.25, ease: "power2.inOut" }, 3.15);
          tl.fromTo(flare, { scale: 0.4, opacity: 0.85 },
            { scale: 2.4, opacity: 0, duration: 0.5, ease: "power2.out",
              immediateRender: false }, 3.0);

          // the one sanctioned pulse — chip swells once and settles
          tl.to("#f3jt-chip2", { scale: 1.06, duration: 0.14, ease: "power2.out" }, 3.05);
          tl.to("#f3jt-chip2", { scale: 1, duration: 0.28, ease: "power2.inOut" }, 3.19);

          // traveling dot hands off to the lit node (mid-shot handoff, not an exit)
          tl.to("#f3jt-dotinner", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.12);

          /* ===== Scene 3 (3.3–4.715s) — shield draws, tag lands, dead-still =====
             VO: "sooner means it plays it safer." (3.19–4.28) */

          // svg-path-draw: outline traces, then the check strikes through
          tl.to("#f3jt-shield-outline",
            { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.55);
          tl.to("#f3jt-shield-check",
            { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 3.95);

          // muted tag beside the shield on "plays it safer"
          tl.fromTo("#f3jt-tag", { opacity: 0, y: 12 },
            { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.05);

          // 4.45 → 4.715: dead-still hold — no exit (the root transition owns it)

          window.__timelines["03-question-timeline"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
