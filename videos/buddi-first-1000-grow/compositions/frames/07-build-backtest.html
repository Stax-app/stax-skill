      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

          0.12

        // per-icon stroke draw setup (svg-path-draw: measured lengths)

        f07IcoPaths.forEach((p) => {

          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
        });

        const f07Cards = ["#f07-card1", "#f07-card2", "#f07-card3", "#f07-card4"];
        f07Cards.forEach((sel, i) => {
          const at = 1.05 + i * 0.42; // cascade across "builds the whole thing for you"

            sel,
            { opacity: 0, y: 46, scale: 0.97 },
            { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" },
            at
          );
          // the card's icon strokes draw as the card lands
          const paths = gsap.utils.toArray(sel + " .f07-ico-path");
          paths.forEach((p, j) => {
            tl.to(
              p,
              { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" },
              at + 0.14 + j * 0.08
            );
          });
          // sub-line fades a hair after the title
          tl.fromTo(
            sel + " .f07-sub",
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power2.out" },
            at + 0.26

          "#f07-divpill",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.7)" },

        // gentle macro push under act 1 keeps the stack alive until the clear
        tl.fromTo(
          "#f07-act1",
          { scale: 1 },
          { scale: 1.012, duration: 3.3, ease: "none" },
          1.0

        /* ── Scene 2 (4.38–5.38s): clear-upward + the REQUIRED ~0.5s HOLD.

           near-empty dark from ~4.88 to 5.38 (the pre-chart beat). ───────── */
        tl.to(
          "#f07-act1",
          { y: -860, duration: 0.5, ease: "power3.in" },
          4.38
        );
        tl.fromTo(
          "#f07-act1",
          { filter: "blur(0px)" },
          { filter: "blur(10px)", duration: 0.5, ease: "power3.in" },
          4.38
        );
        tl.to(
          "#f07-act1",
          { opacity: 0, duration: 0.44, ease: "none" },
          4.44
        );

        /* ── Scene 3 (5.38–7.7s): the proof — BACKTEST RESULT pill leads, the
           chart card rises, gridlines wash in, the green equity curve DRAWS
           left→right (svg-path-draw, linear rate) with the gray dashed
           comparison revealed just behind; "on real past prices" lands on
           its spoken cue. No numbers, no axis labels, no markers. ────────── */
        tl.fromTo(
          "#f07-btpill",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          5.38
        );
        tl.fromTo(

          { opacity: 0, y: 64, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" },

        const f07Grid = gsap.utils.toArray(".f07-gridln");
        f07Grid.forEach((el, i) => {
          tl.fromTo(

            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },

        });

        // equity curve draw (getTotalLength dasharray, constant rate)
        const f07Line = document.getElementById("f07-line");
        const f07Len = f07Line.getTotalLength() * 1.02;
        f07Line.style.strokeDasharray = String(f07Len);
        f07Line.style.strokeDashoffset = String(f07Len);
        tl.fromTo(
          f07Line,
          { strokeDashoffset: f07Len },
          { strokeDashoffset: 0, duration: 1.6, ease: "none" },
          5.95
        );

        // dashed comparison line — dash pattern intact; clip rect expands
        tl.fromTo(
          "#f07-cmprect",
          { attr: { width: 0 } },
          { attr: { width: 840 }, duration: 1.6, ease: "none" },

        );

        tl.fromTo(

            ease: "power3.out",

          },

        );

        // "on real past prices" — muted caption on its spoken cue (7.23s)
        tl.fromTo(

          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },

        );
