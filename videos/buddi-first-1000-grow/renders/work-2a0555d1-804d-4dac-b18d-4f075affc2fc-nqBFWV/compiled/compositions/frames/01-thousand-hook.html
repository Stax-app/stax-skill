    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var SHOT = 5.013;      /* VO / shot length — all choreography completes by here */
        var TL_END = 5.513;    /* host window incl. 0.5s crossfade tail (still hold) */
        var H = 264;           /* digit cell height */

        var odo = document.getElementById("01-thousand-hook-odo");
        var glow = document.getElementById("01-thousand-hook-glow");
        var arrow = document.getElementById("01-thousand-hook-arrow");
        var typed = document.getElementById("01-thousand-hook-typed");
        var caret = document.getElementById("01-thousand-hook-caret");
        var underline = document.getElementById("01-thousand-hook-underline");
        var blurNode = document.getElementById("01-thousand-hook-streakblur");
        var tag = document.getElementById("01-thousand-hook-tag");
        tag.textContent = "2026"; /* script-sourced, matches the spoken cue */

        /* Build the digit strips synchronously at setup (index-driven, no randomness).
           Each strip = full 0-9 revolutions ending on the target digit; column A
           carries one spare cell ("2") past its landing "1" so the overshoot
           has a visible drum to roll onto. */
        function buildStrip(el, revolutions, extraDigits) {
          var digits = [];
          for (var r = 0; r < revolutions; r++) {
            for (var d = 0; d <= 9; d++) digits.push(d);
          }
          for (var e = 0; e < extraDigits.length; e++) digits.push(extraDigits[e]);
          for (var i = 0; i < digits.length; i++) {
            var cell = document.createElement("div");
            cell.className = "thk-cell";
            cell.textContent = String(digits[i]);
            el.appendChild(cell);
          }
        }
        var colA = document.getElementById("01-thousand-hook-colA");
        var colB = document.getElementById("01-thousand-hook-colB");
        var colC = document.getElementById("01-thousand-hook-colC");
        var colD = document.getElementById("01-thousand-hook-colD");
        buildStrip(colA, 2, [0, 1, 2]); /* lands index 21 → "1" ("2" = overshoot spare) */
        buildStrip(colB, 2, [0]);       /* lands index 20 → "0" */
        buildStrip(colC, 3, [0]);       /* lands index 30 → "0" */
        buildStrip(colD, 4, [0]);       /* lands index 40 → "0" */

        var tl = gsap.timeline({ paused: true });

        /* ── Scene 1 (0–2.0s): the cash odometer.
           "$" fixed; four columns roll $0,000 → $1,000 like a slot-machine
           odometer. Outer columns settle first; the thousands "1" lands LAST
           with a decelerating overshoot (sanctioned pop #1), locking the full
           "$1,000" at ~1.76s — on the spoken "$1,000" cue (1.50–2.04s). ── */
        tl.fromTo(
          odo,
          { opacity: 0, y: 36 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.02
        );

        var ROLL_AT = 0.10;
        /* rightmost first — each column its own duration + revolutions */
        tl.fromTo(colD, { y: 0 }, { y: -40 * H, duration: 1.00, ease: "power2.inOut" }, ROLL_AT);
        tl.fromTo(colC, { y: 0 }, { y: -30 * H, duration: 1.20, ease: "power2.inOut" }, ROLL_AT);
        tl.fromTo(colB, { y: 0 }, { y: -20 * H, duration: 1.38, ease: "power2.inOut" }, ROLL_AT);
        /* the "1": rolls PAST its landing by a third of a cell, then settles
           back with a soft deceleration — two adjacent finite tweens, no yoyo */
        tl.fromTo(colA, { y: 0 }, { y: -(21 * H + 90), duration: 1.46, ease: "power2.inOut" }, ROLL_AT);
        tl.to(colA, { y: -21 * H, duration: 0.20, ease: "power3.out" }, 1.56);

        /* faint green glow pulses ONCE as the full "$1,000" locks (1.76s) */
        tl.fromTo(
          glow,
          { opacity: 0, scale: 0.9 },
          { opacity: 0.34, scale: 1, duration: 0.22, ease: "power2.out" },
          1.74
        );
        tl.to(glow, { opacity: 0.1, duration: 0.6, ease: "power2.inOut" }, 1.96);

        /* "2026" tag-pill pops beside the numeral on the spoken "2026" cue
           (2.50–3.05s) — sanctioned pop #2: one finite overshoot, no exit */
        tl.fromTo(
          tag,
          { opacity: 0, scale: 0.5, y: 16 },
          { opacity: 1, scale: 1, y: 0, duration: 0.38, ease: "back.out(2.2)" },
          2.55
        );

        /* ── Scene 2 (3.2–4.3s): on "without picking a single stock" (VO 3.22s)
           the green arrow SHOOTS in from off-left with a motion-blur streak —
           blur envelope shares the position tween's window + ease, so peak
           smear rides peak speed and the arrow snaps sharp as it skids to a
           stop. Then the question types fast behind it. ── */
        var MOVE_AT = 3.18;
        var MOVE_DUR = 0.42;
        var blurProxy = { v: 26 };
        var writeBlur = function () {
          blurNode.setAttribute("stdDeviation", blurProxy.v + " 0"); /* X-axis only */
        };
        writeBlur(); /* seed so any seek before the settle shows the streaked state */

        tl.fromTo(
          arrow,
          { x: -820, opacity: 0 },
          { x: 0, opacity: 1, duration: MOVE_DUR, ease: "power4.out" },
          MOVE_AT
        );
        tl.fromTo(
          blurProxy,
          { v: 26 },
          { v: 0, duration: MOVE_DUR, ease: "power4.out", onUpdate: writeBlur },
          MOVE_AT
        );

        /* discrete-text-sequence — fast ~0.045s keystrokes, done by ~4.27s */
        var PHRASE = "where does it go?";
        var TYPE_AT = 3.55;
        var STEP = 0.045;
        var SEQ = [{ t: 0, s: "" }];
        for (var c = 1; c <= PHRASE.length; c++) {
          SEQ.push({ t: TYPE_AT + (c - 1) * STEP, s: PHRASE.substring(0, c) });
        }
        function textAt(time) {
          for (var i = SEQ.length - 1; i >= 0; i--) {
            if (time >= SEQ[i].t) return SEQ[i].s;
          }
          return "";
        }

        /* micro-polish flourish — after the question lands (~4.27s), a thin
           green underline sweeps left→right beneath it: one finite fromTo,
           done by ~4.75s (all motion still by SHOT − 0.15s ≈ 4.86s), no exit */
        tl.fromTo(
          underline,
          { scaleX: 0, transformOrigin: "left center" },
          { scaleX: 1, duration: 0.35, ease: "power3.out" },
          4.40
        );

        /* ── Scene 3 (4.75s–end): dead still; only the caret sin-blinks,
           deterministically, and ends HIDDEN (mid off-phase held through the
           crossfade tail). One driver owns typed text + caret state — no CSS
           animation, seek-safe. ── */
        var drv = { t: 0 };
        tl.to(
          drv,
          {
            t: TL_END,
            duration: TL_END,
            ease: "none",
            onUpdate: function () {
              var t = drv.t;
              typed.textContent = textAt(t);
              if (t < 3.30) {
                caret.style.opacity = "0"; /* hidden until the arrow arrives */
              } else if (t < 4.32) {
                caret.style.opacity = "1"; /* solid while typing */
              } else {
                /* blink in the hold — sin period 0.66s, phase-locked at 4.32:
                   ON 4.32–4.65, OFF 4.65–4.98, ON 4.98–5.31, OFF 5.31–5.513
                   → ends hidden, deterministic (no flicker across the
                   crossfade tail's final frames) */
                caret.style.opacity =
                  Math.sin(((t - 4.32) * Math.PI * 2) / 0.66) >= 0 ? "1" : "0";
              }
            }
          },
          0
        );

        window.__timelines["01-thousand-hook"] = tl;
      })();
