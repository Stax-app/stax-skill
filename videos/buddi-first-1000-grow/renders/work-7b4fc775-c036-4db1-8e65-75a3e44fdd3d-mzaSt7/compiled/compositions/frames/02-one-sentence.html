      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const D = 6.955; // frame duration, synced to voice 02.wav

        /* ---- key voice cues (audio_meta.json, frame 2) ----
           "Here's the move."                     0.10–0.83 → chrome + input settle
           "Instead of you guessing…"             1.09–1.98 → fog of guesses fades in, cloud drifts
           "…you tell an AI called Buddi"         1.98–3.20 → cloud tumbles, camera leans in
           "one sentence:"                        3.20–3.89 → fragments CONDENSE into the bar,
                                                              typing begins (~0.04s keystrokes)
           "I've got $1,000 … what to do with it" 4.03–6.50 → typed line runs under the spoken one,
                                                              send FIRES → bubble → Buddi dots */
        const FOG_IN = 1.1;
        const CONDENSE_AT = 3.26;
        const TYPE_START = 3.5;
        const FIRE = 5.56; // send press begins; caret + typed line die here
        const PRESS_DUR = 0.1;
        const RELEASE_AT = FIRE + PRESS_DUR;
        const MORPH_START = 5.74;
        const MORPH_DUR = 0.68;

        /* ================= FOG OF GUESSES — depth-scatter-assemble ==================
           Scattered state per fragment is pure trig on its index (golden angle) — no
           Math.random, byte-identical every render. Cloud center sits at canvas
           (540, 420); stage center is (540, 960), so cloud offset y = −540. Condense
           target = the input bar mouth (bar center 540, 716 → stage offset y −244). */
        const frags = Array.from(document.querySelectorAll(".f2-frag"));
        const N = frags.length;
        const GOLDEN = Math.PI * (3 - Math.sqrt(5)); // ~2.39943 — even spread, no clumps
        const RADIUS_X = 380;
        const RADIUS_Y = 230;
        const Z_NEAR = 240;
        const Z_FAR = -260;
        const TUMBLE = 26; // slight tumble — fixed rotations
        const CLOUD_Y = -540; // cloud center offset from stage center
        const BAR_Y = -244; // input-bar mouth offset from stage center

        const scatter = frags.map((el, i) => {
          const a = i * GOLDEN;
          const depthT = N > 1 ? i / (N - 1) : 0;
          return {
            x: Math.cos(a) * RADIUS_X,
            y: CLOUD_Y + Math.sin(a) * RADIUS_Y,
            z: Z_NEAR - depthT * (Z_NEAR - Z_FAR),
            rotationX: Math.sin(a) * TUMBLE,
            rotationY: Math.cos(a) * TUMBLE,
            driftX: Math.sin(a * 1.7) * 26,
            driftY: Math.cos(a * 1.3) * 22,
            dim: 0.85 - depthT * 0.18, // nearer = brighter, all muted
            blur: 1 + depthT * 2.5, // farther = blurrier (static, set once)
            size: 40 + (i % 3) * 8,
          };
        });

        // Park every fragment in the cloud BEFORE any tween fires (rule: no teleport).
        frags.forEach((el, i) => {
          const s = scatter[i];
          el.style.fontSize = s.size + "px";
          el.style.filter = "blur(" + s.blur + "px)";
          gsap.set(el, {
            xPercent: -50,
            yPercent: -50,
            x: s.x,
            y: s.y,
            z: s.z,
            rotationX: s.rotationX,
            rotationY: s.rotationY,
            opacity: 0,
          });
        });

        /* ---- discrete-text-sequence: fast keystroke schedule (~0.04s, fixed jitter) ---- */
        const TXT = "I've got $1,000 and no idea what to do with it"; // matches bubble text
        const JIT = [0.010, -0.008, 0.012, 0.002, -0.010, 0.011, -0.004, 0.006]; // fixed table — no Math.random
        const SEQ = [{ t: 0, n: 0 }];
        let acc = TYPE_START;
        for (let i = 1; i <= TXT.length; i++) {
          let d = 0.034 + JIT[i % JIT.length];
          if (TXT[i - 1] === " ") d += 0.014; // short word-break breath
          acc += d;
          SEQ.push({ t: acc, n: i });
          if (i === 15) acc += 0.1; // micro pause after "$1,000"
          if (i === 27) acc += 0.06; // micro pause after "idea"
        }

        const typedEl = document.getElementById("f2-typed");
        const caretEl = document.getElementById("f2-caret");
        const worldEl = document.getElementById("f2-world");

        /* ticker push: caret pinned near frame-center.
           Pill left 100 + inner pad 44 → viewport origin x=144; frame center 540 → pin at 396. */
        const PIN = 396;
        const BLINK_PERIOD = 0.9;
        const TYPING_GRACE = 0.18;

        /* Single driver — text state, ticker shift, caret blink are pure functions of
           driver.t (seek-safe; re-measured per frame). */
        const driver = { t: 0 };
        tl.to(
          driver,
          {
            t: D,
            duration: D,
            ease: "none",
            onUpdate: () => {
              const t = driver.t;
              let idx = 0;
              for (let i = SEQ.length - 1; i >= 0; i--) {
                if (t >= SEQ[i].t) {
                  idx = i;
                  break;
                }
              }
              typedEl.textContent = TXT.slice(0, SEQ[idx].n);
              const w = typedEl.offsetWidth;
              gsap.set(worldEl, { x: Math.min(0, PIN - (w + 10)) });
              // caret: solid while typing, deterministic sin blink while idle, gone at FIRE
              let vis = 0;
              if (t < FIRE) {
                const typing = idx > 0 && t - SEQ[idx].t < TYPING_GRACE;
                vis = typing
                  ? 1
                  : Math.sin(((t + 0.24) * Math.PI * 2) / BLINK_PERIOD) > 0
                    ? 1
                    : 0;
              }
              caretEl.style.opacity = vis;
            },
          },
          0,
        );

        /* ---- Scene 1 (0–2.8s): chrome + input settle, then the fog of guesses ---- */
        tl.fromTo(
          "#f2-pill",
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          0.02,
        );
        tl.fromTo(
          "#f2-stepper",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.08,
        );
        // first stepper check strokes in — svg-path-draw micro-flourish on "the move"
        tl.fromTo(
          "#f2-check",
          { strokeDashoffset: 14 },
          { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
          0.45,
        );

        // fog fades in on "instead of you guessing" — dim, blurred, tumbling slightly
        frags.forEach((el, i) => {
          const s = scatter[i];
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: s.dim, duration: 0.6, ease: "power2.out", immediateRender: false },
            FOG_IN + 0.02 + i * 0.09,
          );
          // slow deterministic drift while the cloud floats (ends before condense)
          tl.fromTo(
            el,
            { x: s.x, y: s.y, rotationX: s.rotationX, rotationY: s.rotationY },
            {
              x: s.x + s.driftX,
              y: s.y + s.driftY,
              rotationX: s.rotationX * 0.72,
              rotationY: s.rotationY * 0.72,
              duration: 2.1,
              ease: "sine.inOut",
            },
            FOG_IN + i * 0.05,
          );
        });
        // the cloud itself slowly rotates so the scatter has life (finite, no repeat)
        tl.fromTo(
          "#f2-fog-stage",
          { rotationY: 0 },
          { rotationY: 12, duration: 2.3, ease: "sine.inOut" },
          FOG_IN,
        );
        tl.to("#f2-fog-stage", { rotationY: 0, duration: 0.7, ease: "power2.out" }, FOG_IN + 2.3);

        /* ---- Scene 2 (2.8–5.5s): guesses CONDENSE into the bar + the sentence types ---- */
        // camera leans in for the typing push
        tl.fromTo(
          ".f2-cam",
          { x: 0, scale: 1 },
          { x: -24, scale: 1.02, duration: 2.9, ease: "power1.inOut" },
          2.35,
        );
        // each fragment is sucked into the input bar mouth — shrink + fade, index stagger
        frags.forEach((el, i) => {
          tl.to(
            el,
            {
              x: (i - (N - 1) / 2) * 18, // funnel across the bar mouth
              y: BAR_Y,
              z: 0,
              rotationX: 0,
              rotationY: 0,
              scale: 0.12,
              opacity: 0,
              duration: 0.62,
              ease: "power2.in", // accelerates INTO the bar
            },
            CONDENSE_AT + i * 0.06,
          );
        });
        // the bar "absorbs" them — tiny swell as the guesses land
        tl.to("#f2-pill", { scale: 1.015, duration: 0.3, ease: "power1.out" }, 3.42);
        tl.to("#f2-pill", { scale: 1, duration: 0.4, ease: "power2.out" }, 3.72);
        // placeholder yields to the typed line
        tl.to(
          "#f2-placeholder",
          { opacity: 0, duration: 0.14, ease: "power1.in" },
          TYPE_START - 0.06,
        );
        // input border warms green as the distilled sentence fills
        tl.to(
          "#f2-pill",
          { borderColor: "rgba(43,217,124,0.75)", duration: 1.9, ease: "power1.inOut" },
          TYPE_START,
        );

        /* ---- Scene 3 (5.5–6.955s): the send button FIRES ---- */
        // press-release-spring: linear compression in, spring recovery out (sanctioned pop)
        tl.to("#f2-send", { scale: 0.82, duration: PRESS_DUR, ease: "power1.in" }, FIRE);
        tl.to("#f2-send", { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, RELEASE_AT);
        // the typed line compresses horizontally INTO the button (squashes toward the send side)
        tl.to(
          "#f2-typed",
          {
            scaleX: 0.05,
            x: 420,
            opacity: 0,
            transformOrigin: "100% 50%",
            duration: 0.26,
            ease: "power2.in",
          },
          FIRE,
        );
        // camera settles back to neutral with the send
        tl.to(".f2-cam", { x: 0, scale: 1, duration: MORPH_DUR, ease: "power2.inOut" }, MORPH_START);

        /* card-morph-anchor: the bubble is EJECTED from the button — an 84px green disc
           at the send seat re-expands upward into the 640×172 right-aligned user bubble
           (final seat: left 340 / top 400 → right edge 980). */
        tl.fromTo(
          "#f2-bubble",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out", immediateRender: false },
          MORPH_START - 0.02,
        );
        tl.to(
          "#f2-bubble",
          {
            x: -540, // left 880 → 340
            y: -274, // top 674 → 400 — expands UPWARD
            width: 640,
            height: 172,
            borderRadius: 26,
            backgroundColor: "#0E2A20",
            duration: MORPH_DUR,
            ease: "power2.inOut",
          },
          MORPH_START,
        );
        // green-tinted gradient skin + WHITE text fade in over the last 40% of the morph
        tl.fromTo(
          "#f2-bubble-grad",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );
        tl.fromTo(
          "#f2-bubble-text",
          { opacity: 0 },
          { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out", immediateRender: false },
          MORPH_START + MORPH_DUR * 0.6,
        );
        // the input resets — placeholder breathes back in (message away)
        tl.fromTo(
          "#f2-placeholder",
          { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "power1.out", immediateRender: false },
          6.1,
        );

        /* ---- Buddi typing indicator — the handoff to Frame 3. Settle otherwise. ---- */
        tl.fromTo(
          "#f2-indicator",
          { opacity: 0, y: 16, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "power3.out" },
          6.45,
        );
        // finite staggered dot pulse (no loop) — ends inside the frame
