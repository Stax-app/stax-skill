      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        /* Word cues (audio_meta frame 7): "Answer those" 0.1–0.71 ·
           "builds the whole thing for you" 1.07–2.26 · "diversified" 3.07 ·
           "$1,000" 4.42–5.05 (spoken only) · "shows you how" 5.43–5.96 ·
           "performed" 6.62–7.06 · "real past prices" 7.23–7.89 ·
           "before you risk a cent" 7.89–9.04 */

        /* ── ACT 1 · phase A (0.1–1.2s): the machine outline draws itself
           (svg-path-draw — measured lengths, staggered segments). ─────────── */
        const f07Draw = [
          ["#f07-mbody", 0.12, 0.65],
          ["#f07-funnel", 0.42, 0.4],
          ["#f07-slot", 0.55, 0.4],
          ["#f07-gearA-ring", 0.5, 0.4],
          ["#f07-gearA-teeth", 0.62, 0.45],
          ["#f07-gearA-hub", 0.82, 0.22],
          ["#f07-gearB-ring", 0.66, 0.35],
          ["#f07-gearB-teeth", 0.78, 0.4],
          ["#f07-gearB-hub", 0.96, 0.2],
        ];
        f07Draw.forEach(([sel, at, dur]) => {
          const p = document.querySelector(sel);
          const len = p.getTotalLength() * 1.03;
          p.style.strokeDasharray = String(len);
          p.style.strokeDashoffset = String(len);
          tl.fromTo(
            p,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: dur, ease: "power2.out" },
            at
          );
        });

        // gears turn while the machine works — FINITE counter-rotations, ease none
        tl.fromTo(
          "#f07-gearA",
          { rotation: 0 },
          { rotation: 300, svgOrigin: "390 225", duration: 3.1, ease: "none" },
          1.15
        );
        tl.fromTo(
          "#f07-gearB",
          { rotation: 0 },
          { rotation: -405, svgOrigin: "497 300", duration: 3.1, ease: "none" },
          1.15
        );

        /* ── ACT 1 · phase B (0.95–2.5s): four answer dots streak INTO the
           funnel (motion-blur-streak path B — echo ghosts collapse into the
           lead), each intake gives the machine one squash-and-stretch pulse. */
        const F07_DOT_FROM = -430; // off-frame left
        const F07_ECHO_STEP = 36;
        for (let i = 0; i < 4; i++) {
          const at = 0.95 + i * 0.35;
          const set = "#f07-dotset" + (i + 1);
          // lead dot: fast out ease, opacity stated in fromTo (seek-safe)
          tl.fromTo(
            set + " .f07-dot",
            { x: F07_DOT_FROM, opacity: 0 },
            { x: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
            at
          );
          // ghosts: further back along the vector, dimmer, collapse to 0 opacity
          tl.fromTo(
            set + " .f07-g1",
            { x: F07_DOT_FROM - F07_ECHO_STEP, opacity: 0.45 },
            { x: 0, opacity: 0, duration: 0.3, ease: "power4.out" },
            at
          );
          tl.fromTo(
            set + " .f07-g2",
            { x: F07_DOT_FROM - 2 * F07_ECHO_STEP, opacity: 0.22 },
            { x: 0, opacity: 0, duration: 0.3, ease: "power4.out" },
            at
          );
          // the funnel swallows the dot (mid-shot consumption, not a frame exit)
          tl.to(
            set + " .f07-dot",
            { x: 52, scale: 0.3, opacity: 0, duration: 0.16, ease: "power2.in" },
            at + 0.3
          );
          // machine squash-and-stretch pulse per intake
          tl.to(
            "#f07-machinewrap",
            { scaleY: 0.965, scaleX: 1.025, duration: 0.09, ease: "power2.out" },
            at + 0.34
          );
          tl.to(
            "#f07-machinewrap",
            { scaleY: 1, scaleX: 1, duration: 0.22, ease: "power2.out" },
            at + 0.43
          );
        }

        /* ── ACT 1 · phase C (1.3–3.6s): shelf rails draw, then four rule
           chips lob OUT of the output slot one by one — conveyor hop (rise,
           arc, fall, squash-settle) into their shelf slots. ────────────────── */
        tl.fromTo(
          "#f07-shelf1",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
          1.25
        );
        tl.fromTo(
          "#f07-shelf2",
          { scaleX: 0, opacity: 0 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
          1.4
        );

        // slot mouth (canvas px) and each chip's resting center — deltas per index
        const F07_SLOT = { x: 870, y: 600 };
        const f07ChipCenters = [
          { x: 296, y: 930 },
          { x: 784, y: 930 },
          { x: 296, y: 1060 },
          { x: 784, y: 1060 },
        ];
        f07ChipCenters.forEach((c, i) => {
          const sel = "#f07-chip" + (i + 1);
          const at = 1.5 + i * 0.5;
          const fx = F07_SLOT.x - c.x;
          const fy = F07_SLOT.y - c.y;
          tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, at);
          tl.fromTo(
            sel,
            { scale: 0.55 },
            { scale: 1, duration: 0.5, ease: "power2.out" },
            at
          );
          tl.fromTo(
            sel,
            { rotation: -12 },
            { rotation: 0, duration: 0.56, ease: "power2.out" },
            at
          );
          tl.fromTo(
            sel,
            { x: fx },
            { x: 0, duration: 0.56, ease: "power1.inOut" },
            at
          );
          // the hop: pop up out of the slot, then fall onto the shelf
          tl.fromTo(
            sel,
            { y: fy },
            { y: fy - 50, duration: 0.18, ease: "power2.out" },
            at
          );
          tl.to(sel, { y: 0, duration: 0.38, ease: "power2.in" }, at + 0.18);
          // squash-settle on landing
          tl.to(sel, { scaleY: 0.93, scaleX: 1.05, duration: 0.09, ease: "power1.out" }, at + 0.56);
          tl.to(sel, { scaleY: 1, scaleX: 1, duration: 0.2, ease: "power2.out" }, at + 0.65);
        });

        // DIVERSIFIED stamps onto the shelf on the spoken word (3.07s) —
        // sanctioned pop #1 (spring-pop-entrance: fromTo scale 0→1, power3.out)
        tl.fromTo(
          "#f07-divpill",
          { scale: 0, opacity: 0, rotation: -3 },
          { scale: 1, opacity: 1, rotation: -3, duration: 0.45, ease: "power3.out" },
          3.12
        );

        // gentle macro push keeps act 1 alive until the clear
        tl.fromTo(
          "#f07-act1",
          { scale: 1 },
          { scale: 1.014, duration: 4.0, ease: "none" },
          0.3
        );

        /* ── SEAM (4.38–4.9s): machine + chips clear upward with blur — then
           the REQUIRED ~0.5s near-empty dark hold (4.9 → 5.4). ─────────────── */
        tl.to("#f07-act1", { y: -1250, duration: 0.5, ease: "power3.in" }, 4.38);
        tl.fromTo(
          "#f07-act1",
          { filter: "blur(0px)" },
          { filter: "blur(10px)", duration: 0.5, ease: "power3.in" },
          4.38
        );
        tl.to("#f07-act1", { opacity: 0, duration: 0.44, ease: "none" }, 4.44);

        /* ── ACT 2 · phase A (5.4–6.05s): "shows you how…" — the green
           BACKTEST RESULT pill lands top-center FIRST, then the chart card
           rises and the gridline field washes in. ──────────────────────────── */
        tl.fromTo(
          "#f07-btwrap",
          { opacity: 0, y: -46, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
          5.4
        );
        tl.fromTo(
          "#f07-chartcard",
          { opacity: 0, y: 70, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" },
          5.58
        );
        gsap.utils.toArray(".f07-gridln").forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            5.78 + i * 0.035
          );
        });

        /* ── ACT 2 · phase B (6.05–7.9s): the plotter draws. The glowing dot
           LEADS (deterministic sampled path points), the line TRAILS from it
           (svg-path-draw, same window + ease "none" so tip == dot), and the
           area fill washes in beneath the drawn portion (clip rect on the
           same linear envelope). Curve dips once mid-way, then climbs. ─────── */
        const F07_DRAW_AT = 6.05;
        const F07_DRAW_DUR = 1.85;
        const f07Line = document.getElementById("f07-line");
        const f07LineLen = f07Line.getTotalLength();
        f07Line.style.strokeDasharray = String(f07LineLen * 1.03);
        f07Line.style.strokeDashoffset = String(f07LineLen * 1.03);
        tl.fromTo(
          f07Line,
          { strokeDashoffset: f07LineLen * 1.03 },
          { strokeDashoffset: 0, duration: F07_DRAW_DUR, ease: "none" },
          F07_DRAW_AT
        );

        // pre-sample the path once (deterministic); the head lerps between samples
        const F07_N = 160;
        const f07Pts = [];
        for (let i = 0; i <= F07_N; i++) {
          const pt = f07Line.getPointAtLength((f07LineLen * i) / F07_N);
          f07Pts.push({ x: pt.x, y: pt.y });
        }
        const f07Head = document.getElementById("f07-plothead");
        gsap.set(f07Head, { x: f07Pts[0].x, y: f07Pts[0].y });
        const f07Prog = { t: 0 };
        tl.fromTo(
          f07Prog,
          { t: 0 },
          {
            t: 1,
            duration: F07_DRAW_DUR,
            ease: "none",
            onUpdate: () => {
              const f = f07Prog.t * F07_N;
              const i0 = Math.min(Math.floor(f), F07_N - 1);
              const fr = f - i0;
              const a = f07Pts[i0];
              const b = f07Pts[i0 + 1];
              gsap.set(f07Head, {
                x: a.x + (b.x - a.x) * fr,
                y: a.y + (b.y - a.y) * fr,
              });
            },
          },
          F07_DRAW_AT
        );
        tl.fromTo(
          f07Head,
          { opacity: 0 },
          { opacity: 1, duration: 0.15, ease: "power1.out" },
          F07_DRAW_AT - 0.05
        );

        // area wash — clip rect expands on the SAME linear envelope as the draw
        tl.fromTo(
          "#f07-arearect",
          { attr: { width: 0 } },
          { attr: { width: 844 }, duration: F07_DRAW_DUR, ease: "none" },
          F07_DRAW_AT
        );

        /* ── ACT 2 · phase C (7.3s): "real past prices" — the gray dashed
           comparison line reveals underneath via clipPath expand. ──────────── */
        tl.fromTo(
          "#f07-cmprect",
          { attr: { width: 0 } },
          { attr: { width: 844 }, duration: 1.0, ease: "power2.inOut" },
          7.3
        );

        /* ── ACT 2 · phase D (7.9–9.515s): "before you risk a cent" — the
           plotter dot arrives and pulses ONCE (sanctioned pop #2), the glow
           blooms behind the chart, the disclaimer fades in; held read. NO
           exit — the root transition owns the cut out of this frame. ────────── */
        tl.fromTo(
          "#f07-pulsering",
          { opacity: 0.9, scale: 0.4 },
          { opacity: 0, scale: 3.2, svgOrigin: "0 0", duration: 0.8, ease: "power2.out" },
          7.95
        );
        tl.to(
          "#f07-plotdot",
          { scale: 1.45, svgOrigin: "0 0", duration: 0.12, ease: "power2.out" },
          7.92
        );
        tl.to(
          "#f07-plotdot",
          { scale: 1, svgOrigin: "0 0", duration: 0.25, ease: "power2.out" },
          8.04
        );
        tl.fromTo(
          "#f07-glow",
          { opacity: 0, scale: 0.88 },
          { opacity: 0.3, scale: 1, duration: 0.9, ease: "power2.out" },
          8.0
        );
        tl.fromTo(
          "#f07-disclaimer",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
          8.25
        );

        window.__timelines["07-build-backtest"] = tl;
      </script>
    </template>
  </body>
</html>
